name: Admin owner portal browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'admin-shell.css'
      - 'admin-usage.js'
      - 'admin-section-metrics.js'
      - 'admin-ops.js'
      - 'manager-office-chat.css'
      - 'admin-staff.html'
      - 'tests/admin-shell-browser.cjs'
      - '.github/workflows/admin-shell-browser.yml'
  push:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'admin-shell.css'
      - 'admin-usage.js'
      - 'admin-section-metrics.js'
      - 'admin-ops.js'
      - 'manager-office-chat.css'
      - 'admin-staff.html'
      - 'tests/admin-shell-browser.cjs'
      - '.github/workflows/admin-shell-browser.yml'
permissions:
  contents: read
jobs:
  admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify admin login, sidebar, panel isolation and unchanged staff office
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walid-admin-server.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:8765/admin/ >/dev/null; then break; fi; sleep .3; done
          node tests/admin-shell-browser.cjs
