name: Aladdin scoped editorial regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/islamic-literature/aladdin/index.html"
      - "tests/test_aladdin_editorial.py"
      - "tests/aladdin-reader-e2e.mjs"
      - ".github/workflows/aladdin-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aladdin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Aladdin plot, TOC, original reader chrome and scoped content
        run: python3 tests/test_aladdin_editorial.py
  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium for Aladdin page QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify 320/375/768/1280px layout, chapter links, logo, font and footer
        run: node tests/aladdin-reader-e2e.mjs
