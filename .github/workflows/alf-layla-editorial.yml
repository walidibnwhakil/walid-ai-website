name: Alf Layla editorial and reader browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/islamic-literature/alf-layla/index.html"
      - "tests/alf-layla-reader-e2e.mjs"
      - ".github/workflows/alf-layla-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alf-layla-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate story completion, TOC, branding and responsive browser
        run: node tests/alf-layla-reader-e2e.mjs
