name: Ali Baba editorial and responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/islamic-literature/ali-baba/**"
      - "tests/test_ali_baba_editorial.py"
      - "tests/ali-baba-responsive-e2e.mjs"
      - ".github/workflows/ali-baba-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ali Baba chapters, plot beats and TOC
        run: python3 tests/test_ali_baba_editorial.py
  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate mobile and desktop reader, navigation and branding
        run: node tests/ali-baba-responsive-e2e.mjs
