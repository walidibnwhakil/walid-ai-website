name: Audit all 114 Quran surah pages
on:
  pull_request:
    branches: [main]
    paths:
      - 'islam/quran/**'
      - 'tests/test_quran_layout.py'
      - '.github/workflows/audit-quran-114-once.yml'
  push:
    branches: [main]
    paths:
      - 'islam/quran/**'
      - 'tests/test_quran_layout.py'
      - '.github/workflows/audit-quran-114-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 114 source datasets and statically readable Quran pages
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          base = Path('islam/quran')
          metadata = json.loads((base / 'data/metadata.json').read_text(encoding='utf-8'))
          # Credits and other utility pages are not surah pages.
          pages = [base / info['slug'] / 'index.html' for info in metadata]
          assert len(metadata) == len(pages) == 114
          assert all(page.is_file() for page in pages), 'A surah page is missing'
          total = 0
          for expected_number, info in enumerate(metadata, 1):
              assert info['number'] == expected_number
              raw = json.loads((base / 'data' / f'surah-{expected_number:03}.json').read_text(encoding='utf-8'))
              verses = raw['verses']
              assert raw['surah'] == expected_number
              assert len(verses) == info['verseCount']
              for idx, ayah in enumerate(verses, 1):
                  assert ayah['verse'] == idx
                  assert isinstance(ayah.get('arabic'), str) and ayah['arabic'].strip()
                  assert isinstance(ayah.get('translation'), str) and ayah['translation'].strip()

              html = (base / info['slug'] / 'index.html').read_text(encoding='utf-8')
              rendered = [int(n) for n in re.findall(r'<article class="ayah" id="ayah-(\d+)"', html)]
              assert rendered == list(range(1, info['verseCount'] + 1)), info['slug']
              assert 'class="translation"' in html, info['slug']
              assert 'class="arabic"' in html, info['slug']
              assert 'class="banner-meaning"' in html, info['slug']
              assert 'id="surah-context"' in html, info['slug']
              assert '/islam/quran/reader.js' in html and '/islam/quran/verses-stable.js' in html
              assert ('<article class="ayah basmala">' in html) == (expected_number != 9), info['slug']
              total += len(verses)

          assert total == 6236, total
          css = (base / 'quran.css').read_text(encoding='utf-8')
          assert '#verses .ayah:not(.basmala)>.arabic' in css
          print(f'PASS: {len(pages)} statically readable surahs; {total} verified source ayahs')
          PY
      - name: Verify Quran layout behaviour against current markup
        run: python3 -m unittest discover -s tests -p 'test_quran_layout.py' -v
