name: Crusades editorial and browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/crusades/index.html"
      - "tests/test_crusades_editorial.py"
      - "tests/crusades-responsive-e2e.mjs"
      - ".github/workflows/crusades-reader.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Crusades chapters, anchors, content, design invariants
        run: python3 tests/test_crusades_editorial.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium test environment
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render Crusades and exercise TOC at mobile and desktop sizes
        run: node tests/crusades-responsive-e2e.mjs
