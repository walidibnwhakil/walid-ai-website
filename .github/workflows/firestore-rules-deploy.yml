name: Firestore rules validation and controlled deployment

on:
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "scripts/test-firestore-rules-emulator.mjs"
      - "scripts/guard-firestore-rules-deploy.mjs"
      - ".github/workflows/firestore-rules-deploy.yml"
  push:
    branches: [main, ops/riddlex-firestore-rules-deploy-20261122]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "scripts/test-firestore-rules-emulator.mjs"
      - "scripts/guard-firestore-rules-deploy.mjs"
      - ".github/workflows/firestore-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase CLI and emulator test dependencies
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing firebase
      - name: Start Firestore emulator and test actual access rules
        run: npx firebase emulators:exec --only firestore --project demo-walid-ai-rules "node scripts/test-firestore-rules-emulator.mjs"

  deploy:
    # Never deploy a PR or a feature branch. Only a reviewed main commit.
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: firestore-production
    env:
      PROJECT_ID: walid-ai-511908
      FIREBASE_SERVICE_ACCOUNT_PRESENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WALID_AI_511908 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require one-time GitHub Secret; never accept keys in repository or chat
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_PRESENT" ]]; then
            echo "::error::Add repository secret FIREBASE_SERVICE_ACCOUNT_WALID_AI_511908 (service-account JSON) before deployment."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v2
        id: gcloud
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WALID_AI_511908 }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Back up the currently active rules (and refuse loss of unrelated collections)
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcloud.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID"
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GOOGLE_OAUTH_ACCESS_TOKEN" \
            "$BASE/releases/cloud.firestore" > "$RUNNER_TEMP/current-firestore-release.json"
          RULESET=$(node -e 'const f=require(process.argv[1]); if(!f.rulesetName)process.exit(1); console.log(f.rulesetName)' \
            "$RUNNER_TEMP/current-firestore-release.json")
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GOOGLE_OAUTH_ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/$RULESET" > "$RUNNER_TEMP/current-firestore-ruleset.json"
          node scripts/guard-firestore-rules-deploy.mjs "$RUNNER_TEMP/current-firestore-ruleset.json"
      - name: Upload pre-deploy backup for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-firestore-rules-backup
          path: |
            ${{ runner.temp }}/current-firestore-release.json
            ${{ runner.temp }}/current-firestore-ruleset.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install Firebase CLI
        run: npm install --no-save --package-lock=false firebase-tools
      - name: Deploy ONLY Firestore security rules to the correct project
        run: npx firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
