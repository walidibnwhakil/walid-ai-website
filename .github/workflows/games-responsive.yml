name: Games mobile two-column layout

on:
  pull_request:
    paths:
      - "games/index.html"
      - "games/previews.css"
      - "tests/games-responsive-e2e.mjs"
      - ".github/workflows/games-responsive.yml"
  push:
    branches: [main]
    paths:
      - "games/index.html"
      - "games/previews.css"
      - "tests/games-responsive-e2e.mjs"
      - ".github/workflows/games-responsive.yml"

permissions:
  contents: read

jobs:
  games-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate game cards on phones and desktop
        run: node tests/games-responsive-e2e.mjs
