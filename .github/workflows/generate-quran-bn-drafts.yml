name: Generate Bengali Quran drafts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new ayahs for this run (0 = all remaining)"
        required: false
        default: "0"
      batch_size:
        description: "Ayahs per committed draft batch"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quran-bengali-draft-workflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Arabic-only Bengali drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WALID_PROVIDER_ORDER: ${{ vars.WALID_PROVIDER_ORDER }}
        run: |
          python3 scripts/generate_quran_bn_bulk.py             --limit "${{ inputs.limit }}"             --batch-size "${{ inputs.batch_size }}"
      - name: Validate draft gate
        run: python3 scripts/validate_quran_bn_draft.py
      - name: Commit generated drafts and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran-bn
          git diff --cached --quiet || git commit -m "Generate resumable Bengali Quran draft batch"
          git push origin HEAD:codex/quran-bengali-draft-workflow
