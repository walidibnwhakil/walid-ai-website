name: Gopal Bhar book editorial regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/folklore/gopal-bhar/index.html"
      - "tests/test_gopal_bhar_editorial.py"
      - "tests/gopal-bhar-reader-e2e.mjs"
      - ".github/workflows/gopal-bhar-editorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 17 standalone tales, exact TOC and preserved reader
        run: python3 tests/test_gopal_bhar_editorial.py

  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify Gopal Bhar at four responsive widths and chapter dialog interaction
        run: node tests/gopal-bhar-reader-e2e.mjs
