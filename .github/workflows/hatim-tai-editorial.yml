name: Hatim Tai book editorial checks
on:
  pull_request:
    branches: [main]
    paths:
      - "others/islamic-literature/hatim-tai/index.html"
      - "tests/test_hatim_tai_editorial.py"
      - "tests/hatim-tai-responsive-e2e.mjs"
      - ".github/workflows/hatim-tai-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate seven complete quests, TOC, metadata and styling contracts
        run: python3 tests/test_hatim_tai_editorial.py -v
  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate Hatim Tai reader at mobile and desktop widths
        run: node tests/hatim-tai-responsive-e2e.mjs
