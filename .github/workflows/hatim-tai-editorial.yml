name: Hatim Tai book editorial checks
on:
  pull_request:
    branches: [main]
    paths:
      - "others/islamic-literature/hatim-tai/index.html"
      - "tests/test_hatim_tai_editorial.py"
      - ".github/workflows/hatim-tai-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate seven complete quests, TOC, metadata and styling contracts
        run: python3 -m unittest tests/test_hatim_tai_editorial.py -v
