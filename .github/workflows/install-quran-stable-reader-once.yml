name: Install stable Quran reader on 114 pages
on:
  push:
    paths:
      - .github/workflows/install-quran-stable-reader-once.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=sorted(Path('islam/quran').glob('*/index.html'))
          assert len(pages)==114,len(pages)
          tag='<script defer src="/islam/quran/verses-stable.js?v=08c885b2"></script>'
          for p in pages:
              s=p.read_text()
              if 'verses-stable.js' not in s:
                  assert '</head>' in s,p
                  s=s.replace('</head>',tag+'</head>',1)
                  p.write_text(s)
              assert s.count('verses-stable.js')==1,p
          print('Stable Arabic-first renderer installed on 114 pages')
          PY
          node --check islam/quran/verses-stable.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add islam/quran/*/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install stable Quran reader on all 114 pages"
            git push
          fi
