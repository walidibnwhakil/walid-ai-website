name: Build privacy-minimized itch package
on:
  push:
    branches: [release/itch-safe-packages-20261126]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-itch-snakes.py
      - run: |
          for f in games/snakes-and-ladders/*.test.mjs; do node --test "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: snakes-and-ladders-itch
          path: dist-itch/snakes-and-ladders.zip
          retention-days: 7
