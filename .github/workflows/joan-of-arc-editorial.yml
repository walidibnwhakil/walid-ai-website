name: Joan of Arc editorial and responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/joan-of-arc/index.html"
      - "tests/test_joan_of_arc_editorial.py"
      - "tests/joan-of-arc-responsive-e2e.mjs"
      - ".github/workflows/joan-of-arc-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Check chronology, trial evidence, integrated narrative, sidebar and metadata
        run: python3 tests/test_joan_of_arc_editorial.py
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check five mobile and desktop viewport sizes and reader navigation
        run: node tests/joan-of-arc-responsive-e2e.mjs
