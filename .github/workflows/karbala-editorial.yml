name: Karbala editorial and responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/karbala/**"
      - "tests/karbala-editorial-e2e.mjs"
      - ".github/workflows/karbala-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  karbala-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium test environment
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate book structure, chronology, chapter TOC and real browser layout
        run: node tests/karbala-editorial-e2e.mjs
