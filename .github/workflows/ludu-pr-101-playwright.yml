name: Ludu Mahir Playwright verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/ludo.mjs'
      - 'games/ludo/**'
      - '.github/workflows/ludu-pr-101-playwright.yml'
      - 'tests/ludo*.cjs'
      - 'tests/ludo*.mjs'

permissions:
  contents: read

jobs:
  ludo-playwright:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Run Ludu browser verification
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ludu-http.log 2>&1 &
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node --test games/ludo-rules.test.mjs games/ludo/pawn-layout.test.mjs games/ludo/layout.test.cjs games/ludo/sound.test.cjs
          node tests/ludo-real-gameplay.cjs
          node tests/ludo-pr-101.spec.mjs
          node tests/ludo-tip-geometry.cjs
          node tests/ludo-pawn-layers.cjs
          node tests/ludo-combined-evidence.cjs
        env:
          BASE_URL: http://127.0.0.1:4173
          LUDO_BASE_URL: http://127.0.0.1:4173
          LUDO_SCREENSHOTS: screenshots/ludo-layout
      - name: Upload screenshots and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludu-playwright-evidence
          path: |
            test-results/
            screenshots/
            tests/fixtures/ludo-layers/
            tests/fixtures/ludo-combined/
            tests/fixtures/ludo-readable-gameplay/
            /tmp/ludu-http.log
          if-no-files-found: warn
