name: Napoleon editorial and responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/napoleon/index.html"
      - "tests/test_napoleon_editorial.py"
      - "tests/napoleon-responsive-e2e.mjs"
      - ".github/workflows/napoleon-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  napoleon:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate chapter chronology, family dates, TOC and branding
        run: python3 tests/test_napoleon_editorial.py
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Render Napoleon reader at four viewport widths
        run: node tests/napoleon-responsive-e2e.mjs
