name: Others reading library responsive E2E
on:
  pull_request:
    branches: [main]
    paths:
      - "others/**"
      - "tests/others-responsive-e2e.mjs"
      - "tests/others-reader-progress-e2e.mjs"
      - "tests/reading-session-e2e.mjs"
      - "assets/reading-session.js"
      - "islam/quran/reader.js"
      - "islam/quran/reading-flow.js"
      - "islam/quran/auto-scroll.js"
      - "islam/quran/index.js"
      - "islam/quran/index.html"
      - "islam/quran/quran.css"
      - "tests/quran-surah-index-mobile-e2e.mjs"
      - "tests/quran-ayah-desktop-alignment-e2e.mjs"
      - "islam/stories/stories.js"
      - ".github/workflows/others-responsive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify Ottoman editorial structure and design contracts
        run: python3 tests/test_ottoman_editorial.py
      - name: Verify Khalid ibn al-Walid chronology and content integrity
        run: python3 tests/test_khalid_editorial.py
      - name: Verify catalog names, editorial subtitles and icon provenance
        run: python3 tests/test_others_catalog_editorial.py
      - name: Audit 30 canonical books, sitemap and retired chapter hashes
        run: python3 tests/test_others_library_contract.py
      - name: Verify all Others books and catalog pages at mobile and desktop widths
        run: |
          node tests/others-responsive-e2e.mjs
          node tests/others-reader-progress-e2e.mjs
          node --check assets/reading-session.js
          node --check islam/quran/reading-flow.js
          node tests/reading-session-e2e.mjs
          node tests/quran-surah-index-mobile-e2e.mjs
          node tests/quran-ayah-desktop-alignment-e2e.mjs
