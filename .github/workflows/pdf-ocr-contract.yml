name: PDF OCR and browser E2E

on:
  pull_request:
    paths:
      - "tools/pdf-browser/**"
      - "fonts/NotoSansBengali-Regular.ttf"
      - "tests/fixtures/bengali-mixed*"
      - "tests/ocr-language-contract.mjs"
      - "tests/pdf-bengali-export-contract.mjs"
      - "tests/pdf-browser-e2e.mjs"
      - "tests/tesseract-benchmark.mjs"
      - ".github/workflows/pdf-ocr-contract.yml"
  push:
    branches: [main, "fix/**", "codex/**"]

permissions:
  contents: read

jobs:
  pdf-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Install OCR engine and Bengali language data
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-core tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng
          BENGALI_FONT="$(fc-match -f '%{file}' 'Noto Sans Bengali:lang=bn' | head -n 1)"
          test -s "$BENGALI_FONT"
          echo "Using Bengali fixture font: $BENGALI_FONT"
          convert -background white -fill black -font "$BENGALI_FONT" -pointsize 54 tests/fixtures/bengali-mixed.svg tests/fixtures/bengali-mixed.png
          identify tests/fixtures/bengali-mixed.png
          tesseract --list-langs | grep -qx ben
          tesseract --list-langs | grep -qx eng
          tesseract tests/fixtures/bengali-mixed.png tests/fixtures/bengali-mixed-ocr -l ben+eng --psm 6
          cat tests/fixtures/bengali-mixed-ocr.txt
      - run: node tests/ocr-language-contract.mjs
      - run: node tests/pdf-bengali-export-contract.mjs
      - run: node tests/pdf-browser-e2e.mjs
      - id: tesseract
        name: Run Tesseract ground-truth benchmark
        run: node tests/tesseract-benchmark.mjs
      - name: Report Bengali OCR accuracy blocker
        if: steps.tesseract.outcome == 'failure'
        run: echo "::warning::Tesseract ben+eng fixture did not recover all Bengali ground-truth tokens; see benchmark logs."
