name: Production PDF tools smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/pdf-production-smoke.yml"
      - "tests/pdf-production-smoke.mjs"
      - "tools/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  production-pdf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install smoke-test dependencies
        run: npm install --no-save playwright jszip pdf-lib pngjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production smoke test
        env:
          PDF_SMOKE_BASE_URL: https://walid-ai.com
        run: node tests/pdf-production-smoke.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-pdf-smoke-diagnostics
          path: test-results/pdf-production-smoke
          if-no-files-found: ignore
          retention-days: 14
