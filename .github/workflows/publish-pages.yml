name: Publish Walid AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Pre-render verified Sports match snapshots
        run: python3 scripts/render_sports_snapshot.py
      - name: Generate true-size transparent PWA icons from the original flower
        run: python3 scripts/build_pwa_icons.py
      - name: Stage only public runtime files
        run: python3 scripts/stage_public_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # A rerun must never create duplicate artifacts with the same name.
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for GitHub Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The upload response can precede artifact visibility in GitHub's API.
          # Poll for the exact attempt-specific artifact before deploying.
          for attempt in $(seq 1 18); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[].name' | grep -Fxq "${PAGES_ARTIFACT}"; then
              echo "Pages artifact indexed: ${PAGES_ARTIFACT}"
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (${attempt}/18)"
            sleep 5
          done
          echo "::error::Pages artifact was uploaded but did not become visible."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
