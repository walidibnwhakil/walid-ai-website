name: Build original-flower PWA icon files

on:
  pull_request:
    paths:
      - "walid-ai-approved-flower.png"
      - "scripts/build_pwa_icons.py"
      - "manifest.webmanifest"
      - ".github/workflows/pwa-assets.yml"

permissions:
  contents: write

jobs:
  original-flower-icons:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build real 192x192 and 512x512 transparent PNGs
        run: python3 scripts/build_pwa_icons.py
      - name: Validate exported icon dimensions and transparency
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for size in (192, 512):
              p = Path(f"pwa/icon-{size}.png")
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              width, height, depth, color = struct.unpack_from(">IIBB", data, 16)
              assert (width, height, depth, color) == (size, size, 8, 6)
              print(f"Verified {p}, {size}x{size}, RGBA with transparency")
          PY
      - name: Commit generated PNG assets to the proposed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/icon-192.png pwa/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate original-flower PWA icon PNGs"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
