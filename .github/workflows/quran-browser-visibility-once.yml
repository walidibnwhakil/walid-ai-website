name: Quran browser visibility 114 surahs
on:
  push:
    paths:
      - .github/workflows/quran-browser-visibility-once.yml
      - islam/quran/reader.js
      - islam/quran/verses-stable.js
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
      - name: Test every surah in real mobile browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/quran-http.log 2>&1 &
          sleep 1
          curl -fsS -I http://127.0.0.1:8765/islam/quran/al-baqarah/
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          (async()=>{
            console.log('START browser verification');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            console.log('BROWSER launched');
            const page=await browser.newPage({viewport:{width:360,height:800},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            page.setDefaultTimeout(8000);
            page.setDefaultNavigationTimeout(8000);
            page.on('requestfailed',r=>console.log('REQUEST FAILED',r.url(),r.failure()?.errorText));
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE ERROR',m.text())});
            const dirs=fs.readdirSync('islam/quran',{withFileTypes:true}).filter(d=>d.isDirectory()&&d.name!=='credits'&&fs.existsSync(path.join('islam/quran',d.name,'index.html'))).map(d=>d.name).sort();
            if(dirs.length!==114)throw Error('Expected 114 pages; found '+dirs.length);
            let total=0;
            for(const slug of dirs){
              const errors=[];
              page.removeAllListeners('pageerror');
              page.on('pageerror',e=>errors.push(e.message));
              console.log('CHECK',slug);
              console.log('NAVIGATE',slug);
              await Promise.race([page.goto('http://127.0.0.1:8765/islam/quran/'+slug+'/',{waitUntil:'domcontentloaded',timeout:8000}),new Promise((_,reject)=>setTimeout(()=>reject(Error('NAVIGATION WATCHDOG '+slug)),12000))]);
              console.log('NAVIGATED',slug);
              try {await page.waitForFunction(()=>document.querySelectorAll('#verses>.ayah:not(.basmala)').length>0,null,{timeout:6000});}
              catch(e){const state=await page.evaluate(()=>({surah:document.body.dataset.surah,status:document.querySelector('#load-status')?.textContent,script:[...document.scripts].map(x=>x.src),cards:document.querySelectorAll('#verses>.ayah').length}));throw Error('READER TIMEOUT '+JSON.stringify({slug,state,errors})+' '+e.message)}
              const result=await page.evaluate(()=>{
                const n=Number(document.body.dataset.surah);
                const cards=[...document.querySelectorAll('#verses>.ayah:not(.basmala)')];
                const all=cards.map(c=>{
                  const a=c.querySelector('.arabic'),r=a?.getBoundingClientRect(),style=a&&getComputedStyle(a);
                  return {text:a?.textContent?.trim(),visible:!!r&&r.height>0&&r.width>0&&style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0};
                });
                const b=document.querySelector('#verses>.basmala .arabic');
                return {n,count:cards.length,arabic:all.every(x=>x.text&&x.visible),basmala:!!b&&!!b.textContent.trim()&&b.getBoundingClientRect().height>0};
              });
              await page.waitForFunction(()=>document.querySelectorAll('.quran-sidebar .side-list a').length===114,null,{timeout:6000});
              const reader=await page.evaluate(()=>({
                tabLabels:[...document.querySelectorAll('.quran-tab')].map(t=>t.textContent.trim()),
                sidebarLinks:document.querySelectorAll('.quran-sidebar .side-list a').length,
                selected:document.querySelector('.quran-tab[aria-selected="true"]')?.textContent.trim(),
                arabicOnly:![...document.querySelectorAll('#verses .translation')].some(x=>!x.hidden),
                translationOff:document.querySelector('#show-translation')?.checked===false,
                pronunciationOff:document.querySelector('#show-pronunciation')?.checked===false,
                oldNotesRemoved:!document.querySelector('#show-notes')
              }));
              if(JSON.stringify(reader.tabLabels)!==JSON.stringify(['সূরা','সূরা পরিচিতি','ফযীলত','নাজিলের ইতিহাস','ব্যাখ্যা'])||
                reader.sidebarLinks!==114||reader.selected!=='সূরা'||!reader.arabicOnly||
                !reader.translationOff||!reader.pronunciationOff||!reader.oldNotesRemoved)throw Error('READER CONTROLS '+JSON.stringify({slug,reader,errors}));
              // Verify Bengali reading aids are actually rendered and do not contain broken glyphs.
              await page.locator('#show-pronunciation').check();
              const pronunciationCheck=await page.evaluate(()=>{
                const cards=[...document.querySelectorAll('#verses>.ayah:not(.basmala)')];
                const aids=cards.map(card=>card.querySelector('.pronunciation'));
                return {
                  visible:aids.filter(a=>a&&!a.hidden&&a.getBoundingClientRect().height>0).length,
                  malformed:aids.filter(a=>a&&/[\uFFFD\u25CC\u25EF\u09F0\u09F1]|\u09CD[\u09BE-\u09CC]|[‘’][\u09BE-\u09CC]/u.test(a.textContent)).length,
                  missing:aids.filter(a=>!a||!a.textContent.trim()).length
                };
              });
              if(pronunciationCheck.visible!==result.count||pronunciationCheck.malformed||pronunciationCheck.missing)
                throw Error('BENGALI PRONUNCIATION DISPLAY '+JSON.stringify({slug,pronunciationCheck,expected:result.count}));
              await page.locator('#show-pronunciation').uncheck();
              if(result.n===3){
                await page.locator('#show-translation').check();
                if(await page.locator('#verses .translation:not([hidden])').count()<1)throw Error('Bengali meaning toggle did not reveal translations');
                await page.locator('[data-section="intro"]').click();
                if(!await page.locator('.quran-section-panel h2').getByText('সূরা পরিচিতি').count())throw Error('Introduction tab not visible');
                await page.locator('[data-section="surah"]').click();
                if(await page.locator('#verses>.ayah:not(.basmala)').count()!==200)throw Error('Returning to Surah tab lost verses');
                await page.screenshot({path:'quran-reader-mobile.png'});
              }
              const expected=JSON.parse(fs.readFileSync('islam/quran/data/surah-'+String(result.n).padStart(3,'0')+'.json')).verses.length;
              if(result.count!==expected||!result.arabic||(result.n!==1&&result.n!==9&&!result.basmala))throw Error(JSON.stringify({slug,result,expected,errors}));
              total+=result.count;
              console.log('PASS',slug,result.count,'Arabic verses',result.basmala?'Bismillah':'');
            }
            if(total!==6236)throw Error('Total verses '+total);
            console.log('PASS ALL 114 SURAHS, 6236 VISIBLE ARABIC VERSES, BASMALA WHERE APPLICABLE');
            const desktop=await browser.newPage({viewport:{width:1366,height:900}});
            await desktop.goto('http://127.0.0.1:8765/islam/quran/aal-i-imraan/',{waitUntil:'domcontentloaded'});
            await desktop.waitForFunction(()=>document.querySelectorAll('.quran-sidebar .side-list a').length===114 && document.querySelectorAll('#verses>.ayah:not(.basmala)').length===200);
            const layout=await desktop.evaluate(()=>{
              const sidebar=document.querySelector('.quran-sidebar'),banner=document.querySelector('.surah-head'),list=document.querySelector('.quran-sidebar .side-list'),tabs=document.querySelector('.quran-section-tabs');
              return {sidebarLeft:sidebar.getBoundingClientRect().left,bannerLeft:banner.getBoundingClientRect().left,
                listScrolls:list.scrollHeight>list.clientHeight,overflowY:getComputedStyle(list).overflowY,
                gap:tabs.getBoundingClientRect().top-banner.getBoundingClientRect().bottom};
            });
            if(layout.sidebarLeft>=layout.bannerLeft||!layout.listScrolls||layout.overflowY!=='auto'||layout.gap>25)throw Error('DESKTOP LAYOUT '+JSON.stringify(layout));
            await desktop.screenshot({path:'quran-reader-desktop.png'});
            await desktop.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Upload reader screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-reader-screenshots
          path: |
            quran-reader-mobile.png
            quran-reader-desktop.png
          if-no-files-found: ignore
