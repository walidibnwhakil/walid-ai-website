name: Quran pronunciation source integrity

on:
  pull_request:
    paths:
      - "islam/quran/data/surah-0[5-8]*.json"
      - "tests/test_islam_quran.py"
      - ".github/workflows/quran-pronunciation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quran-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Quran source, transliteration annotations, routes and hashes
        run: python3 tests/test_islam_quran.py
