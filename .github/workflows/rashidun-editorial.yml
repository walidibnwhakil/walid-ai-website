name: Rashidun editorial and responsive browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/rashidun-caliphate/index.html"
      - "tests/rashidun-reader-e2e.mjs"
      - ".github/workflows/rashidun-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rashidun-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate Rashidun chronology, TOC, content, branding and responsive browser
        run: node tests/rashidun-reader-e2e.mjs
