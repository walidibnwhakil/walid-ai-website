name: Refresh Quran reader for all surahs
on:
  push:
    paths:
      - .github/workflows/refresh-quran-reader-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update all 114 Quran pages to load corrected shared reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=sorted(Path('islam/quran').glob('*/index.html'))
          assert len(pages)==114, len(pages)
          for path in pages:
              before=path.read_text(encoding='utf-8')
              after=re.sub(r'(/islam/quran/reader\.js)(?:\?[^"]*)?',r'\1?v=95f6215b',before)
              after=re.sub(r'<p class="pronunciation-status">.*?</p>','',after,flags=re.S)
              assert 'reader.js?v=95f6215b' in after,path
              assert 'class="pronunciation-status"' not in after,path
              path.write_text(after,encoding='utf-8')
          print('Updated and verified 114 Quran reader pages')
          PY
      - name: Commit Quran page cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add islam/quran/*/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh shared reader across all 114 surahs"
            git push
          fi
