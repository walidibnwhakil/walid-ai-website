name: Remove Quran source callouts from all surahs
on:
  push:
    paths:
      - .github/workflows/remove-quran-callouts-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove unwanted source and pronunciation callouts from 114 pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path("islam/quran").glob("*/index.html"))
          assert len(pages)==114, f"Expected 114 surah pages, got {len(pages)}"
          changed=0
          for path in pages:
              before=path.read_text(encoding="utf-8")
              after=re.sub(r'<p class="pronunciation-status">.*?</p>', '', before, flags=re.S)
              if after != before:
                  path.write_text(after,encoding="utf-8")
                  changed+=1
              assert 'class="pronunciation-status"' not in after, path
          print(f"Removed callout from {changed} pages; verified all 114.")
          PY
      - name: Commit Quran-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add islam/quran/*/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Remove unwanted source and pronunciation callouts from all 114 Quran pages"
            git push
          fi
