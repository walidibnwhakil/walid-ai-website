name: Riddlex artwork source for QA
on:
  push:
    branches: [fix/riddlex-original-artwork-firebase-20261122]
    paths:
      - ".github/workflows/riddlex-artwork-source.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: riddlex-portrait-original
          path: games/riddlex/images/approved/menu-portrait.webp
          retention-days: 1
