name: Riddlex mobile and desktop regression

on:
  pull_request:
    branches: [main]
    paths:
      - "games/riddlex/**"
      - "firestore.rules"
      - ".github/workflows/riddlex-audit-regression.yml"
  push:
    branches: [main, fix/riddlex-clean-menu-playnow-20261122]
    paths:
      - "games/riddlex/**"
      - "firestore.rules"
      - ".github/workflows/riddlex-audit-regression.yml"

permissions:
  contents: read

jobs:
  riddlex-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check changed JavaScript syntax
        run: |
          node --check games/riddlex/app.js
          node --check games/riddlex/scene.js
          node --check games/riddlex/kb.js
          node --check games/riddlex/learn.js
          node --check games/riddlex/riddlex-responsive-e2e.mjs
      - name: Run the complete Riddlex unit and simulation regression suite
        run: npm test --prefix games/riddlex
      - name: Install browser for portrait and desktop QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Play the real game on phone and desktop layouts
        run: node games/riddlex/riddlex-responsive-e2e.mjs
        env:
          RIDDLEX_SCREENSHOT_DIR: ${{ runner.temp }}/riddlex-visual
      - name: Save phone and desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddlex-menu-and-game-evidence
          path: ${{ runner.temp }}/riddlex-visual/*.png
          if-no-files-found: warn
