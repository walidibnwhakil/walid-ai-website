name: Riddlex natural wood illustration repair
on:
  push:
    branches: [fix/riddlex-natural-wood-20261122]
    paths:
      - ".github/workflows/riddlex-natural-wood.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing libraries
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Restore the wooden tabletop in source illustration
        run: python scripts/riddlex_restore_natural_table.py
      - name: Commit the repaired image, not a CSS workaround
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/riddlex/images/approved/menu-portrait.webp
          git diff --cached --quiet && exit 1
          git commit -m "fix(riddlex): restore continuous rich wood grain around Play Now"
          git push origin "HEAD:fix/riddlex-natural-wood-20261122"
