name: Riddlex 13 new identities — real browser correctness
on:
  pull_request:
    branches: [main]
    paths:
      - "games/riddlex/**"
      - ".github/workflows/riddlex-owner-13-qa.yml"
permissions:
  contents: read
  actions: read
jobs:
  play:
    name: Chromium new owner identities (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and gameplay QA syntax
        run: |
          node --check games/riddlex/owner-13-independent-e2e.mjs
          node --check games/riddlex/engine.js
          node --check games/riddlex/recognition-facts.js
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Play Riddlex against independent known facts
        env:
          RIDDLEX_SHARD: ${{ matrix.shard }}
        run: node games/riddlex/owner-13-independent-e2e.mjs
      - name: Upload full per-question and guess transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddlex-owner13-${{ matrix.shard }}
          path: ${{ runner.temp }}/riddlex-owner-13-part-${{ matrix.shard }}.json
          if-no-files-found: error
  aggregate:
    name: Assert 13/13 correct and preserve all answers
    needs: [play]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve three complete gameplay batches
        uses: actions/download-artifact@v4
        with:
          pattern: riddlex-owner13-*
          path: qa-traces-13
          merge-multiple: true
      - name: Check real outcomes, fail on any missing/incorrect game
        run: node games/riddlex/owner-13-aggregate.mjs qa-traces-13
      - name: Keep complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddlex-owner13-complete-transcripts
          path: ${{ runner.temp }}/riddlex-owner-13-combined.json
          if-no-files-found: warn
