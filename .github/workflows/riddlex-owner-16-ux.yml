name: Riddlex 16-target real-gameplay UX audit
on:
  pull_request:
    branches: [main]
    paths:
      - "games/riddlex/owner-16-ux-e2e.mjs"
      - ".github/workflows/riddlex-owner-16-ux.yml"
permissions:
  contents: read
jobs:
  browser-ux-16:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check QA runner syntax
        run: node --check games/riddlex/owner-16-ux-e2e.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Play 16 real Riddlex sessions and record every bilingual question
        run: node games/riddlex/owner-16-ux-e2e.mjs
      - name: Attach question-by-question UX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddlex-16-full-bilingual-transcripts
          path: ${{ runner.temp }}/riddlex-user-16.json
          if-no-files-found: warn
