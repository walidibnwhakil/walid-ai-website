name: Riddlex independent 25-target gameplay audit
on:
  pull_request:
    branches: [main]
    paths:
      - "games/riddlex/owner-25-e2e.mjs"
      - ".github/workflows/riddlex-owner-25-qa.yml"

permissions:
  contents: read

jobs:
  real-gameplay-25:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check independent browser test syntax
        run: node --check games/riddlex/owner-25-e2e.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Play 25 real Riddlex sessions with independent public-knowledge answers
        run: node games/riddlex/owner-25-e2e.mjs
      - name: Save all 25 actual question-answer transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddlex-owner-25-complete-transcripts
          path: ${{ runner.temp }}/riddlex-owner-25.json
          if-no-files-found: warn
