name: Riddlex owner database manager UI
on:
  pull_request:
    paths:
      - "admin/index.html"
      - "admin-approvals.js"
      - "games/riddlex/admin-catalog.js"
      - "games/riddlex/owner-records.js"
      - "games/riddlex/admin-owner-ui.test.mjs"
      - ".github/workflows/riddlex-owner-manager.yml"
jobs:
  owner-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check admin and game modules
        run: |
          node --check admin-approvals.js
          node --check games/riddlex/admin-catalog.js
          node --check games/riddlex/owner-records.js
          node --check games/riddlex/learn.js
          node --check games/riddlex/app.js
      - name: Install Chromium
        working-directory: games/riddlex
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --with-deps
      - name: Verify manager UI without any production writes
        working-directory: games/riddlex
        run: node admin-owner-ui.test.mjs
