name: Riddlex permanent artwork repair
on:
  push:
    branches: [fix/riddlex-original-artwork-firebase-20261122]
    paths:
      - scripts/repair_riddlex_menu_portrait.py
      - .github/workflows/riddlex-portrait-repair.yml
permissions:
  contents: write
jobs:
  replace-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image repair dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Repair original painting pixels
        run: python scripts/repair_riddlex_menu_portrait.py
      - name: Commit repaired photo to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/riddlex/images/approved/menu-portrait.webp
          git diff --cached --quiet && exit 1
          git commit -m "fix(riddlex): permanently remove baked-in menu stripes"
          git push origin "HEAD:fix/riddlex-original-artwork-firebase-20261122"
