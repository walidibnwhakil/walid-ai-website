name: Riddlex recovery tests
on:
  push:
    branches: [riddlex-recovery]
    paths:
      - 'games/riddlex/**'
      - '.github/workflows/riddlex-recovery.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Riddlex tests
        run: npm test
        working-directory: games/riddlex
