name: Roman Empire editorial and responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/roman-empire/**"
      - "tests/test_roman_empire_editorial.py"
      - "tests/roman-empire-responsive-e2e.mjs"
      - ".github/workflows/roman-empire-editorial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Roman chronology, TOC, historical subjects and editorial quality
        run: python3 tests/test_roman_empire_editorial.py
  reading-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test Roman reader at mobile, tablet and desktop widths
        run: node tests/roman-empire-responsive-e2e.mjs
