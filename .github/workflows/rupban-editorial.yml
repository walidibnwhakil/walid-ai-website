name: Rupban folklore editorial and reader QA
on:
  pull_request:
    branches: [main]
    paths:
      - "others/folklore/rupban/index.html"
      - "tests/test_rupban_editorial.py"
      - "tests/rupban-reader-e2e.mjs"
      - ".github/workflows/rupban-editorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rupban chronology, variants, chapter anchors and SEO
        run: python3 tests/test_rupban_editorial.py
      - name: Verify shared Others reader structure without editing other books
        run: python3 tests/test_others_readers.py

  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium for reader test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify Rupban rendering, responsive layouts and sidebar interaction
        run: node tests/rupban-reader-e2e.mjs
