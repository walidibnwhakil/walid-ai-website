name: Site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, links, Games and Tools structure
        run: python3 scripts/validate_site.py
      - name: Validate Quran, translations, routes, stories and source checksums
        run: python3 tests/test_islam_quran.py
      - name: Validate Bengali Quran draft publication gate
        run: python3 scripts/validate_quran_bn_draft.py
      - name: Run Bengali Quran draft pytest coverage
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q tests/test_quran_bn_draft.py

      - name: Run Bengali Quran bulk importer pytest coverage
        run: python3 -m pytest -q tests/test_quran_bn_bulk_importer.py