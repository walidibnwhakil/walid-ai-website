name: Site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, links, Games and Tools structure
        run: python3 scripts/validate_site.py
      - name: Validate Others books, sidebar and distinctive icons
        run: python3 tests/test_others_readers.py
      - name: Verify editorial subtitles, historically scoped catalog icons and Bengali names
        run: python3 tests/test_others_catalog_editorial.py
      - name: Audit 30 canonical books, sitemap, chapter anchors and retired redirects
        run: python3 tests/test_others_library_contract.py
      - name: Verify British Empire editorial chronology and book shell
        run: python3 tests/test_british_empire_editorial.py
      - name: Verify sourced character context and competing perspectives
        run: python3 tests/test_character_context_editorial.py
      - name: Check balanced character and motive coverage across all 30 books
        run: python3 -m unittest discover -s tests -p 'test_library_character_depth_30.py' -v
      - name: Validate Quran, translations, routes, stories and source checksums
        run: python3 tests/test_islam_quran.py
      - name: Check current Quran header, Basmala and verse layout
        run: python3 -m unittest discover -s tests -p 'test_quran_layout.py' -v
      - name: Verify usage browser test syntax
        run: node --check tests/test_usage_browser.cjs
      - name: Verify current canonical routes, icons and retired Quran workflows
        run: python3 -m unittest discover -s tests -p 'test_canonical_expectations.py' -v
      - name: Validate unified admin sections, JS syntax and legacy redirects
        run: |
          python3 -m unittest discover -s tests -p 'test_staff_workspace_ui.py' -v
          node tests/admin-staff-layout.test.js
          node --check admin-usage.js
          node --check admin-ops.js
          node --check admin-approvals.js
          node --check usage.js
      - name: Validate privacy-safe section analytics and current catalog tracking
        run: |
          python3 -m unittest discover -s tests -p 'test_analytics_sections.py' -v
          node --check admin-section-metrics.js
          node --check admin-analytics-catalog.js
          node --check usage.js
