name: Sports data and display regression
on:
  pull_request:
    branches: [main]
    paths:
      - "sports/**"
      - "scripts/fetch_updates.py"
      - "tests/test_sports_backend.py"
      - "tests/test_sports_frontend.cjs"
      - "tests/sports-responsive-e2e.mjs"
      - "scripts/render_sports_snapshot.py"
      - ".github/workflows/publish-pages.yml"
      - ".github/workflows/sports-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sports:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sports feed Python syntax
        run: python -m py_compile scripts/fetch_updates.py
      - name: Test football and cricket feed normalization
        run: python -m unittest discover -s tests -p 'test_sports_backend.py' -v
      - name: Validate Sports static SEO snapshots
        run: |
          python -m py_compile scripts/render_sports_snapshot.py
          python scripts/render_sports_snapshot.py --check
      - name: Check match card JavaScript syntax
        run: node --check sports/sports.js
      - name: Test BDT, match statuses, scoring and stale states
        run: node tests/test_sports_frontend.cjs
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check football and cricket layouts on phones and desktops
        run: node tests/sports-responsive-e2e.mjs
