name: Walid AI staff monitor

on:
  push:
    branches:
      - codex/walid-ai-staff-team
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional Firestore client
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: python -m pip install --disable-pip-version-check google-cloud-firestore
      - name: Run bounded checks
        env:
          WALID_MONITOR_URL: ${{ vars.WALID_MONITOR_URL || 'https://walid-ai.com' }}
          WALID_ALERT_DEDUP_SECONDS: "21600"
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          fi
          python staff_monitor.py
