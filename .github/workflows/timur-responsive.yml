name: Timur history responsive reader E2E
on:
  pull_request:
    branches: [main]
    paths:
      - "others/history/timur/**"
      - "tests/timur-responsive-e2e.mjs"
      - "tests/test_timur_editorial.py"
      - ".github/workflows/timur-responsive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timur-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify Timur editorial structure, historical anchors and links
        run: python3 -m unittest discover -s tests -p test_timur_editorial.py
      - name: Verify Timur reader in mobile and desktop Chromium
        run: node tests/timur-responsive-e2e.mjs
