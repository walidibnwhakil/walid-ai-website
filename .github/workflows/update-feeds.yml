name: Refresh News and Sports
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_updates.py"
      - "tests/validate_updates.py"
      - ".github/workflows/update-feeds.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feeds
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh verified feeds
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: python scripts/fetch_updates.py
      - run: python tests/validate_updates.py
      - name: Commit changed caches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "walid-ai-updates[bot]"
          git config user.email "walid-ai-updates[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json data/sports.json; then exit 0; fi
          tmp_dir="$(mktemp -d)"
          cp data/news.json data/sports.json "$tmp_dir/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp_dir/news.json" "$tmp_dir/sports.json" data/
            git add data/news.json data/sports.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: refresh news and sports feeds"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to push refreshed caches after 3 attempts without force-pushing." >&2
          exit 1
