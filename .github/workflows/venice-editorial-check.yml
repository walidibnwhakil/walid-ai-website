name: Venice book editorial regression

on:
  pull_request:
    paths:
      - 'others/history/venice/index.html'
      - 'tests/test_venice_editorial.py'
      - '.github/workflows/venice-editorial-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venice-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify Venice content, TOC and mobile/desktop rendering
        run: python tests/test_venice_editorial.py
      - name: Save viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venice-editorial-browser-screenshots
          path: artifacts/venice-editorial/
          if-no-files-found: ignore
