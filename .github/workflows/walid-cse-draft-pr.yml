name: Walid AI CSE guarded PR agent

# Explicitly dispatched by the authenticated owner Manager. Never on a timer.
on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Owner coding request (no credentials or private Help messages)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: walid-cse-draft-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  draft-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate a tightly scoped proposed patch
        env:
          WALID_STAFF_CODER_INSTRUCTION: ${{ inputs.instruction }}
          GROQ_API_KEY: ${{ secrets.WALID_STAFF_GROQ_API_KEY }}
          WALID_STAFF_CODER_MODEL: ${{ vars.WALID_STAFF_CODER_MODEL || 'llama-3.3-70b-versatile' }}
        run: python3 scripts/staff_code_runner.py

      - name: Run safety and syntax checks without any AI credential
        run: |
          git diff --check
          python3 -m py_compile scripts/staff_code_runner.py
          node tests/admin-staff-layout.test.js
          python3 - <<'PY'
          import pathlib, subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          if not changed or len(changed) > 1:
              raise SystemExit("Expected exactly one changed file")
          for path in changed:
              suffix = pathlib.Path(path).suffix
              if suffix == ".py":
                  subprocess.run(["python3", "-m", "py_compile", path], check=True)
              if suffix in (".js", ".mjs", ".cjs"):
                  subprocess.run(["node", "--check", path], check=True)
          print("CSE syntax checks passed for:", changed)
          PY

      - name: Open PR for owner review (never merge or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch="staff/cse-${GITHUB_RUN_ID}"
          git config user.name "Walid AI CSE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -u
          if git diff --cached --quiet; then echo "No changed files"; exit 1; fi
          git commit -m "CSE: propose bounded owner-requested code fix"
          gh auth setup-git
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "CSE Engineer: owner-requested website fix" \
            --body "AI-generated bounded patch. Only one non-protected source file changed. Syntax and office-invariant checks passed in the agent workflow. Repository PR CI and owner review are required before merge. No automatic deployment or merge is enabled."
