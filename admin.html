<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Portal | Walid AI</title>
  <style>
    :root{font:16px/1.5 "Times New Roman",Times,serif;color:#17211a;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:0 auto;padding:28px 20px 60px}h1{margin:10px 0 2px}h2{font-size:1.25rem}a{color:#235c39}button,input{font:inherit;padding:11px 14px;border:1px solid #ccd5ce;border-radius:10px}button{cursor:pointer;background:#18231b;color:#fff}.muted{color:#627066}.panel,.card{background:#fff;border:1px solid #dce4dd;border-radius:15px;padding:18px;margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.card{margin:0}.label{color:#627066}.big{font-size:1.55rem;font-weight:700;overflow-wrap:anywhere}.hidden{display:none!important}input{width:min(100%,420px)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.55 "Times New Roman",Times,serif}.report{border-top:1px solid #e5e9e5;padding:14px 0}.report:first-child{border-top:0}.report time,.report small{display:block;color:#68746c}.report-message{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.notice{font-size:.92rem}.status{min-height:1.5em;color:#9a301f}
  </style>
</head>
<body><main>
  <a href="/">← Walid AI</a><h1>Admin Portal</h1><p class="muted">Private usage, service health, and help inbox.</p>
  <section id="login" class="panel"><label>Admin access key<br><input id="key" type="password" autocomplete="current-password"></label> <button id="enter" type="button">Sign in</button><p id="status" class="status" role="status"></p></section>
  <section id="dashboard" class="hidden">
    <div class="toolbar panel"><a href="/" class="button">Open Walid AI chat as admin</a><button id="refresh" type="button">Refresh</button><button id="exit" type="button">Sign out</button><span id="date" class="muted"></span></div>
    <div class="grid" id="stats"></div>
    <section class="panel"><h2>What people are asking and where</h2><pre id="breakdown"></pre></section>
    <section class="panel"><h2>Recent help messages</h2><p class="muted notice">Visible only in this protected portal. Reports and optional reply email are kept for up to 30 days.</p><div id="helpInbox"></div></section>
    <p id="notes" class="muted notice"></p>
  </section>
</main>
<script src="/backend-config.js"></script><script>
const base=(window.WALID_AI_API||'').replace(/\/$/,''),login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),status=document.querySelector('#status'),stats=document.querySelector('#stats'),tokenKey='walidAdminAccess';let token=sessionStorage.getItem(tokenKey)||'';
function card(label,value){const box=document.createElement('div'),name=document.createElement('div'),amount=document.createElement('div');box.className='card';name.className='label';name.textContent=label;amount.className='big';amount.textContent=value??'—';box.append(name,amount);stats.append(box)}
async function load(){status.textContent='Loading dashboard…';try{const headers={Authorization:'Bearer '+token};const [mr,hr]=await Promise.all([fetch(base+'/api/admin/metrics',{headers}),fetch(base+'/api/admin/help',{headers})]);const d=await mr.json();if(!mr.ok)throw Error('Sign-in failed. Check the admin key and try again.');const hd=hr.ok?await hr.json():{reports:[]};login.classList.add('hidden');dash.classList.remove('hidden');document.querySelector('#date').textContent='Today: '+d.date;stats.replaceChildren();[
  ['Questions today',d.daily_questions],['People today',d.daily_users],['Logged-in users today',d.daily_logged_users],['Accounts used (30 days)',d.logged_users_30d],['All visitors (30 days)',d.unique_users_30d],['Questions (30 days)',d.total_questions_30d],['Answers with errors (30 days)',d.answer_errors_30d],['AI requests / daily cap',d.gemini_requests+' / '+d.gemini_request_limit],['AI requests remaining today',Math.max(0,d.gemini_request_limit-d.gemini_requests)],['Search requests / daily cap',d.search_requests+' / '+d.search_request_limit],['Search requests remaining today',Math.max(0,d.search_request_limit-d.search_requests)],['Input tokens today',d.input_tokens_today],['Output tokens today',d.output_tokens_today],['AI requests (30 days)',d.api_requests_30d],['Estimated API cost today',d.estimated_usd_today==null?'Unavailable':'$'+Number(d.estimated_usd_today).toFixed(6)],['Estimated API cost (30 days)',d.api_estimated_usd_30d==null?'Unavailable':'$'+Number(d.api_estimated_usd_30d).toFixed(6)]
].forEach(x=>card(x[0],x[1]));document.querySelector('#breakdown').textContent='Popular topics (30 days): '+JSON.stringify(d.topics_30d,null,2)+'\n\nPlatforms (30 days): '+JSON.stringify(d.platforms_30d,null,2)+'\n\nAnswer routes (30 days): '+JSON.stringify(d.answer_modes_30d,null,2)+'\n\nAPI errors today (HTTP status / timeout): '+JSON.stringify(d.api_errors_today,null,2)+'\n\nAPI errors (30 days): '+JSON.stringify(d.api_errors_30d,null,2)+'\n\nAPI tokens (30 days): '+JSON.stringify({input:d.api_input_tokens_30d,output:d.api_output_tokens_30d,unpriced_requests:d.api_unpriced_requests_30d},null,2);renderHelp(hd.reports||[]);document.querySelector('#notes').textContent=d.cost_note+' '+d.privacy_note;status.textContent=''}catch(e){if(e.message.startsWith('Sign-in failed')){sessionStorage.removeItem(tokenKey);token=''}login.classList.remove('hidden');dash.classList.add('hidden');status.textContent=e.message}}
function renderHelp(records){const host=document.querySelector('#helpInbox');host.replaceChildren();if(!records.length){host.textContent='No help reports have arrived yet.';return}for(const item of records){const article=document.createElement('article'),time=document.createElement('time'),message=document.createElement('div'),meta=document.createElement('small');article.className='report';time.textContent=new Date(item.received_at).toLocaleString();message.className='report-message';message.textContent=item.message||'';meta.textContent=(item.email?'Reply email: '+item.email+' · ':'')+'Email status: '+(item.email_status||'unknown');article.append(time,message,meta);host.append(article)}}
document.querySelector('#enter').onclick=()=>{token=document.querySelector('#key').value.trim();if(!token){status.textContent='Enter the admin access key.';return}sessionStorage.setItem(tokenKey,token);load()};document.querySelector('#key').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#enter').click()});document.querySelector('#refresh').onclick=load;document.querySelector('#exit').onclick=()=>{sessionStorage.removeItem(tokenKey);token='';dash.classList.add('hidden');login.classList.remove('hidden');status.textContent='Signed out.'};if(token)load();
</script></body></html>
