<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chess | Walid AI Games</title>
    <meta
      name="description"
      content="Premium chess against three local bot levels or a friend. Complete legal chess, clocks and local statistics."
    />
    <link rel="canonical" href="https://walid-ai.com/games/chess/" />
    <link rel="icon" href="/kathgolap-logo.png" />
    <link rel="stylesheet" href="./wood.css" />
    <script type="module" src="./app.mjs?v=20261108refresh-guard"></script>
  <script defer src="/ads-config.js"></script><script defer src="/ad-placement.js"></script>
</head>
  <body>
    <main id="chess-app">
      <header>
        <a class="gold-button" id="back" href="/games/">← Games</a
        ><img class="title" src="./assets/title.webp" alt="Chess" />
        <div class="top-actions">
          <button id="sound" aria-label="Toggle sound" aria-pressed="false">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#sound"></use>
            </svg>
            Sound</button
          ><button id="settings" aria-label="Game settings">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#settings"></use></svg
            >Settings
          </button>
        </div>
      </header>
      <section id="menu" aria-label="Chess setup">
        <div class="hero-pieces" aria-hidden="true">
          <img src="./assets/bn.webp" alt="" /><img
            src="./assets/wk.webp"
            alt=""
          /><img src="./assets/wn.webp" alt="" />
        </div>
        <div class="setup-panel ornate">
          <fieldset>
            <legend>Game Mode</legend>
            <div class="choices" id="modes">
              <button data-value="bot" aria-pressed="true">vs Bot</button
              ><button data-value="local" aria-pressed="false">
                Local (2 Players)</button
              ><button disabled>Online <small>Coming Soon</small></button>
            </div>
          </fieldset>
          <fieldset id="difficulty-field">
            <legend>Bot Difficulty</legend>
            <div class="choices" id="difficulties">
              <button data-value="easy" aria-pressed="false">Easy</button
              ><button data-value="medium" aria-pressed="true">Medium</button
              ><button data-value="hard" aria-pressed="false">Hard</button>
            </div>
          </fieldset>
          <fieldset>
            <legend>Player Side</legend>
            <div class="choices" id="sides">
              <button data-value="w" aria-pressed="true">
                <img src="./assets/wp.webp" alt="" />Play as White</button
              ><button data-value="b" aria-pressed="false">
                <img src="./assets/bp.webp" alt="" />Play as Black
              </button>
            </div>
          </fieldset>
        </div>
        <button id="start" class="start-button">Start Game</button>
        <div class="menu-bottom">
          <button id="rules">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#rules"></use></svg
            >Game Rules</button
          ><button id="statistics">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#statistics"></use></svg
            >Statistics</button
          ><button disabled>Leaderboard<small>Coming Soon</small></button
          ><button id="menu-settings">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#settings"></use></svg
            >Game Settings
          </button>
        </div>
      </section>
      <section id="game" hidden aria-label="Chess game">
        <div id="players">
          <article class="player ornate" id="player-top"></article>
          <div class="versus">VS</div>
          <article class="player ornate" id="player-bottom"></article>
        </div>
        <div class="board-area">
          <div id="desktop-clocks"></div>
          <p id="status" role="status" aria-live="polite"></p>
          <div class="board-frame ornate">
            <div id="board" role="group" aria-label="Chess board"></div>
            <section id="result" hidden aria-label="Game result">
              <div class="particles"></div>
              <div class="fireworks" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="result-emblem"><h2 id="result-title"></h2></div>
              <p id="result-reason"></p>
              <div class="result-actions">
                <button id="again">Play Again</button
                ><button id="result-menu">Back to Menu</button>
              </div>
            </section>
          </div>
        </div>
        <aside class="game-controls ornate" aria-label="Game controls">
          <button id="restart">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#restart"></use></svg
            >Restart</button
          ><button id="hint">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#hint"></use></svg
            >Hint (3)</button
          ><button id="undo">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#undo"></use></svg
            >Undo</button
          ><button id="flip">
            <svg class="control-icon" aria-hidden="true">
              <use href="./assets/icons.svg#flip"></use></svg
            >Flip Board</button
          ><button id="draw">Offer Draw</button
          ><button id="resign">Resign</button>
        </aside>
        <details class="history">
          <summary>Move history</summary>
          <ol id="history"></ol>
        </details>
      </section>
      <dialog id="dialog">
        <div id="dialog-content"></div>
        <button id="close-dialog">Close</button>
      </dialog>
    <aside class="walid-ad-placement" data-walid-ad="games" hidden></aside>
</main>
  </body>
</html>
