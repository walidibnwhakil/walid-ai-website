<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess | Walid AI Games</title>
  <link rel="icon" href="/kathgolap-logo.png">
  <link rel="stylesheet" href="../arcade.css">
  <script type="module" src="../chess.mjs"></script>
</head>
<body>
  <main>
    <nav aria-label="Breadcrumb"><a href="/">Walid AI</a><a href="/games/">Games</a><span aria-current="page">Chess</span></nav>
    <h1>Chess</h1>
    <p>Choose a piece, then choose a highlighted legal destination. White moves first.</p>
    <div class="controls">
      <label hidden>Mode <select id="mode"><option value="bot">Play the bot</option><option value="friend">Two players</option></select></label>
      <button id="restart" type="button">New game</button>
    </div>
    <p id="status" role="status"></p>
    <div id="board" class="board" role="group" aria-label="Chess board"></div>
    <div id="actions" class="controls"></div>
    <p><a href="../vendor/chess-LICENSE.txt">chess.js license</a></p>
  </main>
</body>
</html>
