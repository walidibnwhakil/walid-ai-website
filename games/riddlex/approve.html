<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riddlex approvals</title>
  <link rel="stylesheet" href="./style.css?v=akinator-1">
  <style>
    body { background:#fffaf3; color:#2a1a12; padding:24px; }
    ul { list-style:none; padding:0; display:grid; gap:12px; }
    li { border:1px solid #e6d3b4; border-radius:12px; padding:12px; }
    img { max-width:160px; border-radius:8px; }
  </style>
</head>
<body>
  <main>
    <h1>Riddlex approvals</h1>
    <p>Pending names stay out of the game until three players agree or you approve them.</p>
    <button id="sign-in" type="button">Sign in with Google</button>
    <p id="message" role="status"></p>
    <ul id="list"></ul>
  </main>
  <script src="/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp(window.WALID_FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const list = document.getElementById("list");
    const message = document.getElementById("message");
    document.getElementById("sign-in").onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => { message.textContent = error.message; });
    };
    auth.onAuthStateChanged(async (user) => {
      if (!user) { message.textContent = "Sign in with the owner account."; return; }
      message.textContent = user.email || "Signed in";
      try {
        const snap = await db.collection("riddlex_entries").where("status", "==", "pending").limit(40).get();
        list.innerHTML = "";
        snap.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement("li");
          const title = document.createElement("strong");
          title.textContent = data.nameEn + (data.nameBn ? " · " + data.nameBn : "");
          item.append(title);
          const meta = document.createElement("p");
          meta.textContent = `Confirmations: ${data.confirmations || 0}` + (data.adult ? " · no picture allowed" : "");
          item.append(meta);
          if (data.image && !data.adult) {
            const img = document.createElement("img");
            img.src = data.image;
            img.alt = "";
            item.append(img);
          }
          for (const status of ["approved", "rejected"]) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = status;
            button.onclick = async () => {
              await doc.ref.update({ status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
              item.remove();
            };
            item.append(button);
          }
          list.append(item);
        });
        if (snap.empty) message.textContent += " · nothing pending";
      } catch (error) {
        message.textContent = "This account cannot read the pending list.";
      }
    });
  </script>
</body>
</html>
