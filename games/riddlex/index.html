  <meta property="og:title" content="Riddlex — The Guessing Detective | Walid AI">
  <meta property="og:description" content="Think of a real person, character, animal or object. Riddlex asks one question at a time and tries to guess.">
  <meta property="og:url" content="https://walid-ai.com/games/riddlex/">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261109-pink">
</head>
<body>
  <div id="menu">
    <div class="menu-stage">
      <img class="menu-blur" src="./images/approved/menu-card.png" alt="">
      <div class="menu-frame">
        <a class="menu-back" href="/games/">Back</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-set-lang="en" aria-pressed="true">English</button>
          <button type="button" data-set-lang="bn">বাংলা</button>
        </div>
        <img class="menu-card" src="./images/approved/menu-card.png" alt="Riddlex — The Guessing Detective" width="1672" height="941">
        <button id="play" type="button" aria-label="Play"></button>
      </div>
    </div>
    <footer class="legal-footer">
      <nav aria-label="Site information"><a href="/about-us.html">About Us</a><span aria-hidden="true">·</span><a href="/contact-us.html">Contact Us</a><span aria-hidden="true">·</span><a href="/privacy-policy.html">Privacy Policy</a><span aria-hidden="true">·</span><a href="/terms-of-service.html">Terms of Service</a></nav>
      <p>© 2026 Walid AI. All rights reserved.</p>
    </footer>
  </div>
  <div id="game" hidden>
    <header class="play-top">
      <div class="play-top-left">
        <button id="to-menu" type="button">Menu</button>
        <button id="new" type="button">New game</button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="en">English</button>
        <button type="button" data-set-lang="bn">বাংলা</button>
      </div>
    </header>
    <div class="stage-wrap">
      <canvas id="stage" aria-hidden="true"></canvas>
      <p id="status" class="speech pop" aria-live="polite"></p>
      <div id="categories" hidden>
        <div class="cat-row">
          <button type="button" data-cat="character">Character</button>
          <button type="button" data-cat="object">Object</button>
          <button type="button" data-cat="animal">Animal</button>
        </div>
      </div>
      <div id="hud">
      <div id="answers" role="group" aria-label="Answer">
        <button id="answer-yes" type="button" data-answer="yes">Yes</button>
        <button id="answer-no" type="button" data-answer="no">No</button>
        <button id="answer-unknown" type="button" data-answer="unknown">Don't know</button>
        <button id="answer-probably" type="button" data-answer="probably">Probably</button>
        <button id="answer-probably-not" type="button" data-answer="probably_not">Probably not</button>
      </div>
      <div id="guess" hidden>
        <button id="correct" type="button">Yes, that's it</button>
        <button id="wrong" type="button">No</button>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
      <p id="credit"></p>
      <form id="learn" hidden>
        <label id="learn-name-label"><span id="learn-name-text">Name</span><input id="learn-name" name="name" required maxlength="80" autocomplete="off"></label>
        <div id="learn-photo-row">
          <label id="learn-photo-label"><span id="learn-photo-text">Picture, if you have one</span><input id="learn-photo" name="photo" type="file" accept="image/*"></label>
        </div>
        <p id="learn-note" role="status"></p>
        <button id="learn-save" type="submit">Teach the detective</button>
      </form>
      <div class="hud-row">
        <button id="back" type="button">Back</button>
        <span id="progress"></span>
      </div>
    </div>
    <div id="confirm" class="confirm" hidden>
      <p id="confirm-text">Start a new game?</p>
      <div>
        <button id="confirm-yes" type="button">Yes</button>
        <button id="confirm-no" type="button">No</button>
      </div>
    </div>
    </div>
  </div>
  <script type="module" src="./app.js?v=akinator-9"></script>
  <script src="/usage.js?v=20261109-2"></script>
</body>
</html>
