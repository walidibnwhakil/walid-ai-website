</head>
<body>
  <div id="menu">
    <div class="menu-art">
      <a class="menu-back" href="/games/" data-i18n="back">পেছনে</a>
      <button class="lang-toggle" type="button" data-lang-toggle>English</button>
      <img src="./images/approved/menu-card.png" alt="Riddlex — The Guessing Detective" width="1672" height="941">
      <button id="play" type="button" aria-label="খেলুন"></button>
    </div>
    <footer class="legal-footer">
      <nav aria-label="Site information"><a href="/about-us.html">About Us</a><span aria-hidden="true">·</span><a href="/contact-us.html">Contact Us</a><span aria-hidden="true">·</span><a href="/privacy-policy.html">Privacy Policy</a><span aria-hidden="true">·</span><a href="/terms-of-service.html">Terms of Service</a></nav>
      <p>© 2026 Walid AI. All rights reserved.</p>
    </footer>
  </div>
  <div id="game" hidden>
    <div class="stage-wrap">
      <canvas id="stage" aria-hidden="true"></canvas>
      <p id="status" aria-live="polite"></p>
    </div>
    <div id="hud">
      <p id="progress"></p>
      <div id="answers" role="group" aria-label="Answer">
        <button id="answer-yes" type="button" data-answer="yes">হ্যাঁ</button>
        <button id="answer-no" type="button" data-answer="no">না</button>
        <button id="answer-unknown" type="button" data-answer="unknown">জানি না</button>
        <button id="answer-probably" type="button" data-answer="probably">সম্ভবত</button>
        <button id="answer-probably-not" type="button" data-answer="probably_not">সম্ভবত না</button>
      </div>
      <div id="guess" hidden>
        <button id="correct" type="button">হ্যাঁ, ঠিক ধরেছ</button>
        <button id="wrong" type="button">না</button>
        <button id="retry" type="button" hidden>আবার চেষ্টা</button>
      </div>
      <p id="credit"></p>
      <form id="learn" hidden>
        <label id="learn-name-label">নাম<input id="learn-name" name="name" required maxlength="80" autocomplete="off"></label>
        <div id="learn-photo-row">
          <label id="learn-photo-label">ছবি, থাকলে<input id="learn-photo" name="photo" type="file" accept="image/*"></label>
        </div>
        <p id="learn-note"></p>
        <button id="learn-save" type="submit">গোয়েন্দাকে শেখাও</button>
      </form>
      <div class="hud-row">
        <button id="back" type="button">শেষ উত্তর বদলাও</button>
        <button id="new" type="button">নতুন খেলা</button>
        <button id="to-menu" type="button">মেনু</button>
        <button id="lang-game" type="button" data-lang-toggle>English</button>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js?v=akinator-1"></script>
  <script src="/usage.js?v=20261109-2"></script>
</body>
</html>
