<link rel="stylesheet" href="/walid-legal.css">
</head>
<body>
  <div id="menu">
    <div class="menu-stage">
      <img class="menu-blur" alt="" data-landscape="./images/approved/menu-user-approved.webp?v=20261122-menu">
      <div class="menu-frame">
        <a class="menu-back" href="/games/">Back</a>
        <img class="menu-card" alt="Riddlex — The Guessing Detective" width="1670" height="942" decoding="async" data-landscape="./images/approved/menu-user-approved.webp?v=20261122-menu">
        <canvas id="menu-cat" class="menu-cat" aria-hidden="true"></canvas>
        <img class="menu-port" alt="" width="720" height="1280" data-portrait="./images/approved/menu-portrait.webp?v=natural-wood-38">
        <script>
          (function () {
            var orientation = matchMedia("(max-aspect-ratio: 4/5)");
            function syncMenuArt() {
              var portrait = orientation.matches;
              document.documentElement.dataset.orient = portrait ? "portrait" : "landscape";
              document.querySelectorAll("#menu img").forEach(function (img) {
                var src = portrait ? img.getAttribute("data-portrait") : img.getAttribute("data-landscape");
                if (src && img.getAttribute("src") !== src) img.src = src;
              });
            }
            syncMenuArt();
            if (orientation.addEventListener) orientation.addEventListener("change", syncMenuArt);
            else orientation.addListener(syncMenuArt);
          })();
        </script>
        <button id="play" type="button" aria-label="Play Now"><span class="play-glyph" aria-hidden="true"></span><span id="play-label">Play Now</span></button>
      </div>
    </div>
  </div>
  <div id="game" hidden>
    <header class="play-top">
      <div class="play-top-left">
        <button id="to-menu" type="button">Menu</button>
        <button id="new" type="button">New game</button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="en">English</button>
        <button type="button" data-set-lang="bn">বাংলা</button>
      </div>
    </header>
    <div class="stage-wrap">
      <canvas id="stage" aria-hidden="true"></canvas>
      <div id="ask-panel">
        <div id="speech" class="speech">
          <span id="q-badge" class="q-badge" hidden></span>
          <p id="status" aria-live="polite"></p>
        </div>
        <div id="answers" role="group" aria-label="Answer">
          <div class="answer-row">
            <button id="answer-yes" type="button" data-answer="yes">Yes</button>
            <button id="answer-no" type="button" data-answer="no">No</button>
            <button id="answer-unknown" type="button" data-answer="unknown">Don't know</button>
          </div>
          <div class="answer-row">
            <button id="answer-probably" type="button" data-answer="probably">Probably</button>
            <button id="answer-probably-not" type="button" data-answer="probably_not">Probably not</button>
          </div>
        </div>
      </div>
      <div id="categories" hidden>
        <div class="cat-row">
          <button type="button" data-cat="character">Character</button>
          <button type="button" data-cat="object">Object</button>
          <button type="button" data-cat="animal">Animal</button>
        </div>
        <button id="load-retry" type="button" hidden>Try again</button>
      </div>
      <div id="hud">
      <p id="guess-line" class="guess-line"></p>
      <div id="guess" hidden>
        <p id="solved-line" hidden>Great! I guessed it.</p>
        <button id="correct" type="button">Yes, that's it</button>
        <button id="wrong" type="button">No</button>
        <button id="retry" type="button" hidden>Try again</button>
        <button id="again" type="button" hidden>Play again</button>
      </div>
      <p id="credit"></p>
      <form id="learn" hidden>
        <label id="learn-name-label"><span id="learn-name-text">Name</span><input id="learn-name" name="name" required maxlength="80" autocomplete="off"></label>
        <div id="learn-photo-row">
          <label id="learn-photo-label"><span id="learn-photo-text">Picture, if you have one</span><input id="learn-photo" name="photo" type="file" accept="image/*"></label>
        </div>
        <p id="learn-note" role="status"></p>
        <button id="learn-save" type="submit">Teach the detective</button>
      </form>
      <button id="learn-again" type="button" hidden>Play again</button>
    </div>
    <button id="back" type="button" hidden aria-label="Previous question" title="Previous question">←</button>
    <span id="progress"></span>
    <div id="confirm" class="confirm" hidden>
      <p id="confirm-text">Start a new game?</p>
      <div>
        <button id="confirm-yes" type="button">Yes</button>
        <button id="confirm-no" type="button">No</button>
      </div>
    </div>
    </div>
  </div>
  <script type="module" src="./app.js?v=riddlex-54"></script>
  <script src="/usage.js?v=20261109-2"></script>
</body>
</html>
