<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riddlex — The Guessing Detective</title><link rel="stylesheet" href="./style.css"></head><body><nav class="games-nav" aria-label="Games"><a href="/games/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="11" rx="5"/><path d="M8 11v5M5.5 13.5h5M15 12h.01M18 15h.01"/></svg><span id="games-link">Games</span></a></nav><main>
<section id="splash-art" class="splash-art" aria-hidden="true">
  <img src="./images/approved/window.jpg" alt="" width="793" height="982">
  <div class="pipe-smoke"></div>
</section>
<section class="office" hidden>
  <div class="rear-wall" aria-hidden="true">
    <img class="founder" data-src="./images/approved/founder.jpg" alt="">
  </div>
  <img class="detective" src="./images/approved/detective.png" alt="" width="276" height="218">
  <div class="foreground" aria-hidden="true"></div>
  <div class="cat" aria-hidden="true">
    <img class="cat-alert" src="./images/approved/cat.png" alt="" width="167" height="130">
    <img class="cat-resting" src="./images/approved/cat-resting.png" alt="" width="330" height="134">
  </div>
  <div class="printer" aria-hidden="true"></div>
  <div class="discarded-note" aria-hidden="true"></div>
  <div class="crumple-hands" aria-hidden="true"></div>
  <div class="paper-ball" aria-hidden="true"></div>
  <div class="resting-note" aria-hidden="true"></div>
  <div id="case-note" class="case-note" hidden>
    <span id="case-note-label">Detective’s note</span>
    <strong id="case-note-name"></strong>
    <img id="case-photo" alt="" hidden>
    <div class="print-grip" aria-hidden="true"></div>
    <div class="writing-pen" aria-hidden="true"></div>
  </div>
</section>
<section class="panel"><h1>Riddlex</h1><button id="play" type="button">Play</button><button id="language" type="button" aria-label="Switch language">বাংলা</button><p id="status" aria-live="polite">Think of a character, animal, object or someone you know.</p><p id="progress" aria-live="off"></p><div id="categories" role="group" aria-label="Choose a category"><button data-category="characters">Characters</button><button data-category="animals">Animals</button><button data-category="objects">Objects</button></div><div id="answers" role="group" aria-label="Answer the detective" hidden><button data-answer="yes" aria-keyshortcuts="1">Yes</button><button data-answer="no" aria-keyshortcuts="2">No</button><button data-answer="probably" aria-keyshortcuts="3">Probably</button><button data-answer="probably-not" aria-keyshortcuts="4">Probably Not</button><button data-answer="unknown" aria-keyshortcuts="5">Don't Know</button></div><div id="guess" role="group" aria-label="Confirm the guess" hidden><button id="correct">Correct!</button><button id="wrong">Wrong</button><button id="retry" hidden>Retry</button></div><button id="back" hidden>↶ Change last answer</button><button id="new">New Game</button><p class="note" id="privacy-note">No personal information is collected.</p></section></main><script type="module" src="./app.js"></script></body></html>
