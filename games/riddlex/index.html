<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riddlex — The Guessing Detective</title><link rel="stylesheet" href="./style.css"></head><body><nav class="games-nav" aria-label="Games"><a href="/games/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="11" rx="5"/><path d="M8 11v5M5.5 13.5h5M15 12h.01M18 15h.01"/></svg><span id="games-link">Games</span></a></nav><main><section class="office"><div class="detective" aria-hidden="true"><img class="character-art" src="./images/detective.svg" alt="" width="240" height="270"><img class="detective-concerned" src="./images/detective.svg#concerned" alt="" width="240" height="270"></div><div class="cat" aria-hidden="true"><img class="character-art" src="./images/cat.svg" alt="" width="180" height="190"><img class="cat-resting" src="./images/cat-resting.svg" alt="" width="180" height="94"></div><div class="desk" aria-hidden="true"></div><svg class="desk-tools" viewBox="0 0 155 55" aria-hidden="true"><path d="M10 31L53 14l42 11-42 20Z" fill="#493322"/><path d="M10 27l43-17 42 11-42 20Z" fill="#d8c297"/><path d="M53 10v31m-29-14 17-7m24-3 15 4" stroke="#8b7351" stroke-width="1"/><path d="m117 31 18 11" stroke="#352720" stroke-width="5" stroke-linecap="round"/><ellipse cx="109" cy="25" rx="13" ry="9" fill="#667b72" fill-opacity=".55" stroke="#bc9a59" stroke-width="2.5"/><path d="m102 24 8-4" stroke="#e0d2a6" stroke-linecap="round"/></svg><div id="case-note" class="case-note" hidden><span id="case-note-label">Detective’s note</span><strong id="case-note-name"></strong><img id="case-photo" alt="" hidden></div></section><section class="panel"><h1>Riddlex</h1><button id="language" type="button" aria-label="Switch language">বাংলা</button><p id="status" aria-live="polite">Think of a character, animal, object or someone you know.</p><p id="progress" aria-live="off"></p><div id="categories" role="group" aria-label="Choose a category"><button data-category="characters">Characters</button><button data-category="animals">Animals</button><button data-category="objects">Objects</button></div><div id="answers" role="group" aria-label="Answer the detective" hidden><button data-answer="yes" aria-keyshortcuts="1">Yes</button><button data-answer="no" aria-keyshortcuts="2">No</button><button data-answer="probably" aria-keyshortcuts="3">Probably</button><button data-answer="probably-not" aria-keyshortcuts="4">Probably Not</button><button data-answer="unknown" aria-keyshortcuts="5">Don't Know</button></div><div id="guess" role="group" aria-label="Confirm the guess" hidden><button id="correct">Correct!</button><button id="wrong">Wrong</button><button id="retry" hidden>Retry</button></div><button id="back" hidden>↶ Change last answer</button><button id="new">New Game</button><p class="note">No personal information is collected.</p></section></main><script type="module" src="./app.js"></script></body></html>
