<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snakes &amp; Ladders — The Serpent King's Realm | Walid AI</title>
    <meta
      name="description"
      content="Enter the Serpent King's Realm. Play animated Snakes & Ladders against a fair bot or with 2–4 local players."
    />
    <link
      rel="canonical"
      href="https://walid-ai.com/games/snakes-and-ladders/"
    />
    <link rel="stylesheet" href="style.css?v=20261109-mode-labels" />
    <script type="module" src="game.mjs?v=20261109-fast"></script>
  </head>
  <body>
    <div id="world">
      <div class="rays"></div>
      <div class="tree"></div>
      <div class="mist"></div>
      <div class="embers"></div>
      <canvas id="cavern-eyes" aria-hidden="true"></canvas>
      <canvas id="live-lava" aria-hidden="true"></canvas>
    </div>
    <header>
      <a
        id="games-link"
        class="icon-control"
        href="/games/"
        aria-label="All Games"
        title="All Games"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 11 12 2l10 9M5 10v12h5v-7h4v7h5V10" /></svg
      ></a>
      <button
        id="menu-button"
        class="icon-control"
        aria-label="Menu"
        title="Menu"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 6h14M5 12h14M5 18h14" />
        </svg>
      </button>
      <div class="header-actions">
        <button
          id="menu-info"
          class="icon-control"
          data-panel="rules"
          aria-label="Game Rules"
          title="Game Rules"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 10v8M12 6v1" />
          </svg>
        </button>
        <button
          id="sound"
          class="icon-control"
          aria-label="Unmute sound"
          aria-pressed="false"
          title="Unmute sound"
        ></button
        ><button
          id="settings-button"
          class="icon-control"
          data-panel="settings"
          aria-label="Settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 3h6l.6 3 2 .9 2.8-.9 2 4-2.3 2v2l2.3 2-2 4-2.8-.9-2 .9-.6 3H9l-.6-3-2-.9-2.8.9-2-4L4 14v-2l-2.4-2 2-4 2.8.9 2-.9Z"
              transform="translate(0 -1) scale(1 .96)"
            />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <section id="menu" aria-label="Snakes and Ladders main menu">
        <div class="menu-scenery" aria-hidden="true"></div>
        <canvas id="jungle-water" aria-hidden="true"></canvas>
        <div class="menu-hero">
          <h1 class="sr-only">Snakes &amp; Ladders</h1>
          <svg id="jungle" viewBox="0 0 1536 1024" aria-hidden="true"></svg>
        </div>
        <canvas id="jungle-life" aria-hidden="true"></canvas>
        <div class="menu-panel">
          <button id="start" class="primary menu-pill">
            <span class="menu-symbol" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <path d="M6 3L29 16 6 29Z" /></svg></span
            ><span>Play Now</span>
          </button>
          <div
            id="player-count-choice"
            role="group"
            aria-label="Local player count"
          >
            <button data-player-count="2" aria-pressed="true">
              2 <small>Players</small></button
            ><button data-player-count="3" aria-pressed="false">
              3 <small>Players</small></button
            ><button data-player-count="4" aria-pressed="false">
              4 <small>Players</small>
            </button>
          </div>
          <button
            id="friends-mode"
            class="menu-pill match-mode"
            aria-pressed="false"
          >
            <span class="menu-symbol" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <circle cx="10" cy="8" r="6" />
                <circle cx="23" cy="10" r="5" />
                <path
                  d="M1 30v-8q0-8 9-8t9 8v8ZM21 17q10-1 10 8v5h-9Z"
                /></svg></span
            ><span class="mode-label">Play with Friends</span>
          </button>
          <button
            id="bot-mode"
            class="menu-pill match-mode selected"
            aria-pressed="true"
          >
            <span class="menu-symbol" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <path
                  d="M8 3h16v9q0 9-8 10-8-1-8-10ZM13 21h6v6h6v4H7v-4h6ZM7 5H1v6q0 8 9 8v-4q-5 0-5-5V9h2ZM25 5h6v6q0 8-9 8v-4q5 0 5-5V9h-2Z"
                /></svg></span
            ><span class="mode-label">Play with Bot</span>
          </button>
          <select id="mode" class="sr-only" aria-label="Game mode">
            <option value="bot">Single Player — vs Bot</option>
            <option value="2">Local Multiplayer — 2 Players</option>
            <option value="3">Local Multiplayer — 3 Players</option>
            <option value="4">Local Multiplayer — 4 Players</option>
          </select>
          <div id="colors" aria-label="Player colors"></div>
          <button class="menu-pill" data-panel="settings">
            <span class="menu-symbol" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path
                  fill-rule="evenodd"
                  d="M9 1h6l1 4 4-1 3 5-3 3 3 3-3 5-4-1-1 4H9l-1-4-4 1-3-5 3-3-3-3 3-5 4 1Zm3 6a5 5 0 1 0 0 10 5 5 0 0 0 0-10"
                /></svg></span
            ><span>Settings</span>
          </button>
          <button class="menu-pill" data-panel="stats">
            <span class="menu-symbol" aria-hidden="true"
              ><svg viewBox="0 0 32 32">
                <path
                  d="M2 18h7v13H2ZM12 10h8v21h-8ZM23 1h7v30h-7Z"
                /></svg></span
            ><span>Statistics</span>
          </button>
        </div>
      </section>
      <section id="play" hidden>
        <div class="game-heading">
          <div>
            <div class="eyebrow">THE SERPENT'S BELLY</div>
            <h2 class="painted-title">
              <img
                data-logo-art="true"
                alt="Snakes &amp; Ladders"
                width="1536"
                height="1024"
              />
            </h2>
          </div>
        </div>
        <div class="game-layout">
          <div class="board-frame">
            <span class="gold-corner top-left" aria-hidden="true">❧</span
            ><span class="gold-corner top-right" aria-hidden="true">❧</span
            ><span class="gold-corner bottom-left" aria-hidden="true">❧</span
            ><span class="gold-corner bottom-right" aria-hidden="true">❧</span>
            <svg
              id="board"
              viewBox="0 0 100 100"
              role="img"
              aria-label="100-square Snakes and Ladders board"
            ></svg>
          </div>
          <aside>
            <div id="players"></div>
            <p id="status" role="status" aria-live="polite">
              Roll a 1 to enter the realm.
            </p>
          </aside>
        </div>
      </section>
    </main>
    <div id="intro" hidden>
      <button id="skip">Skip Intro →</button>
      <div id="entrance-scene"></div>
    </div>
    <dialog id="dialog">
      <button id="close" class="close" aria-label="Close">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <div
      id="celebration"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Match result"
    >
      <div id="defeat-snake"></div>
      <canvas id="result-fireworks" aria-hidden="true"></canvas>
      <div class="fireworks"></div>
      <div class="result-card">
        <div class="crown" aria-hidden="true">
          <svg viewBox="490 0 560 370">
            <image data-logo-art="true" width="1536" height="1024" />
          </svg>
        </div>
        <h2 id="result-title"></h2>
        <p class="victory-caption">The crown is yours</p>
        <p id="result-name"></p>
        <div id="standings"></div>
        <button id="continue" class="primary">Continue Match</button
        ><button id="try-again">Try Again</button
        ><button id="result-menu">Back to Menu</button>
      </div>
    </div>
  </body>
</html>
