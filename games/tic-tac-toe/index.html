    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "name": "Tic Tac Toe",
            "url": "https://walid-ai.com/games/tic-tac-toe/",
            "description": "Play tic-tac-toe in the browser against a bot or a friend on this device. Choose a 3×3, 5×5 or 7×7 board and connect 3, 4 or 5 marks to win.",
            "gamePlatform": "Web browser",
            "playMode": ["SinglePlayer", "MultiPlayer"],
            "applicationCategory": "Game",
            "publisher": {
              "@type": "Organization",
              "name": "Walid AI",
              "url": "https://walid-ai.com/"
            }
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Walid AI",
                "item": "https://walid-ai.com/"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Games",
                "item": "https://walid-ai.com/games/"
              },
              {
                "@type": "ListItem",
                "position": 3,
                "name": "Tic Tac Toe",
                "item": "https://walid-ai.com/games/tic-tac-toe/"
              }
            ]
          }
        ]
      }
    </script>
    <title>Tic Tac Toe | Walid AI Games</title>
    <link rel="icon" href="/kathgolap-logo.png" />
    <link rel="stylesheet" href="./royal.css?v=royal-2" />
    <script type="module" src="../tic-tac-toe.mjs?v=royal-2"></script>
  </head>
  <body>
    <main id="royal-game">
      <nav class="topbar" aria-label="Game navigation">
        <a class="button" href="/games/">← Back</a
        ><span class="brand">WALID AI · GAMES</span
        ><button data-action="sound" aria-pressed="false">Sound Off</button
        ><button data-action="settings" aria-label="Game Settings">⚙</button>
      </nav>
      <header class="title">
        <div class="crown" aria-hidden="true">♛</div>
        <h1>
          <span class="mark x" aria-hidden="true">X</span
          ><span>Tic Tac Toe</span
          ><span class="mark o" aria-hidden="true">O</span>
        </h1>
        <div class="flourish" aria-hidden="true">❧ ━━━━━ ◆ ━━━━━ ❧</div>
      </header>
      <section id="menu" aria-label="Game menu" class="ornate">
        <div class="menu-art" aria-hidden="true">
          <div class="art-crown">♛</div>
          <div class="mini-board">
            <span class="mark x">X</span><span class="mark o">O</span
            ><span></span><span></span><span class="mark x">X</span><span></span
            ><span class="mark o">O</span><span></span
            ><span class="mark x">X</span>
          </div>
          <p>THE ROYAL CHALLENGE</p>
          <small>Think ahead. Claim your crown.</small>
        </div>
        <div class="selectors">
          <fieldset>
            <legend>Game Mode</legend>
            <div class="options" id="modes">
              <button data-mode="bot">♟ vs Bot</button
              ><button data-mode="friend">♟ 2 Players</button
              ><button disabled>◎ Online<small>Coming Soon</small></button>
            </div>
          </fieldset>
          <fieldset>
            <legend>Challenge Level</legend>
            <div class="options" id="levels">
              <button data-level="easy">
                ★ Easy<small>3 × 3 · Connect 3</small></button
              ><button data-level="medium">
                ★★ Medium<small>5 × 5 · Connect 4</small></button
              ><button data-level="hard">
                ♛ Hard<small>7 × 7 · Connect 5</small>
              </button>
            </div>
          </fieldset>
          <fieldset>
            <legend id="symbol-label">Your Symbol</legend>
            <div class="options">
              <button data-symbol="X">
                <span class="mark x">X</span> Play as X</button
              ><button data-symbol="O">
                <span class="mark o">O</span> Play as O
              </button>
            </div>
          </fieldset>
          <button id="start" class="start">▶ Start Game</button>
          <p class="menu-note">
            X always moves first · Every challenge has a competitive bot
          </p>
        </div>
      </section>
      <section id="play" hidden>
        <div class="game-heading">
          <h2 id="level-title"></h2>
          <p id="condition"></p>
        </div>
        <div class="players">
          <span id="player-x"></span
          ><strong id="status" role="status" aria-live="polite"></strong
          ><span id="player-o"></span>
        </div>
        <div id="arena-slot">
          <div id="arena" class="ornate easy">
            <div id="board-wrap">
              <div id="board" role="group" aria-label="Tic Tac Toe board"></div>
              <svg id="fire" aria-hidden="true">
                <defs>
                  <filter id="glow"><feGaussianBlur stdDeviation="3" /></filter>
                </defs>
                <g id="fire-lines"></g>
              </svg>
            </div>
            <canvas id="sparks" aria-hidden="true"></canvas>
            <div id="result" hidden aria-live="polite">
              <h2 id="result-title"></h2>
              <p id="result-detail"></p>
              <div class="controls">
                <button id="again" class="start">Play Again</button
                ><button data-action="menu">Back to Menu</button>
              </div>
            </div>
          </div>
        </div>
        <div class="controls play-controls">
          <button id="restart">↻ Restart</button
          ><button data-action="menu">← Back to Menu</button>
        </div>
      </section>
      <footer class="game-tools">
        <button data-action="rules">▤ Game Rules</button
        ><button data-action="stats">▥ Statistics</button
        ><button disabled>♜ Leaderboard<small>Coming Soon</small></button
        ><button data-action="settings">⚙ Game Settings</button>
      </footer>
      <dialog id="dialog">
        <button id="close-dialog" aria-label="Close dialog">✕</button>
        <div id="dialog-content"></div>
      </dialog>
    </main>
  </body>
</html>
