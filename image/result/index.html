<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Image Result | Walid AI</title>
<link rel="stylesheet" href="/walid-branding.css"><link rel="stylesheet" href="/walid-legal.css">
<style>
*{box-sizing:border-box}body{margin:0;color:#1f2928;background:#fff;font:16px/1.5 "Times New Roman",Times,serif}
.shell{max-width:1130px;padding:22px 18px 56px;margin:auto;min-height:82vh;position:relative;isolation:isolate}
.shell:before{content:"";position:absolute;z-index:-1;pointer-events:none;width:min(540px,80vw);height:min(540px,80vw);left:50%;top:80px;transform:translateX(-50%);background:url("/kathgolap-logo.png") center/contain no-repeat;opacity:.05;animation:flower 10s linear infinite}
@keyframes flower{0%,90%{transform:translateX(-50%) rotate(0)}100%{transform:translateX(-50%) rotate(360deg)}}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top img{width:132px;height:44px;object-fit:contain}
.back{color:#275c4c;text-decoration:none;padding:9px 14px;border:1px solid #cdded6;border-radius:20px}
.intro{text-align:center;margin:32px 0 28px}.eyebrow{font:700 .8rem/1.4 Arial,sans-serif;color:#17815d;text-transform:uppercase;letter-spacing:.11em}
h1{font-size:clamp(30px,4vw,44px);font-weight:500;margin:8px 0}.muted{color:#66736d}.summary{margin-top:9px}
#empty{max-width:650px;margin:55px auto;padding:24px;border:1px solid #e0e8e3;border-radius:16px;text-align:center;background:#fff}
.results{display:grid;gap:20px}.result{background:transparent;border:1px solid #dfe8e2;border-radius:18px;padding:20px;box-shadow:0 8px 32px #0a49320a}
.result-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.result-head h2{font-size:1.15rem;margin:0;overflow-wrap:anywhere}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.compare figure{margin:0;min-width:0}.compare figcaption{font:700 .78rem/1.5 Arial,sans-serif;color:#587167;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
/* Let both images retain their natural proportions; never crop inside a fixed box. */
.preview{display:flex;justify-content:center;align-items:center;min-width:0;padding:8px;background:transparent;border:0;overflow:visible}
.preview img{display:block;width:auto;height:auto;max-width:100%;max-height:min(82vh,1000px);object-fit:contain}.download{display:inline-flex;text-align:center;justify-content:center;min-width:180px;padding:11px 22px;border:0;border-radius:10px;background:#006a4e;color:#fff;text-decoration:none;font-weight:700}.download:hover,.download:focus-visible{background:#004f3a}
.legal-footer{margin-top:44px}@media(max-width:650px){.compare{grid-template-columns:1fr}.preview{padding:4px}.preview img{max-height:78vh}.result{padding:14px}.download{width:100%}.shell{padding:18px 14px 48px}.top img{width:112px;height:38px}}
@media(prefers-reduced-motion:reduce){.shell:before{animation:none}}
</style></head>
<body><main class="shell"><header class="top"><a href="/"><img src="/walid-ai-approved-logo.png" alt="Walid AI"></a><a class="back" id="editMore" href="/image/">Image Tools</a></header>
<section class="intro"><h1 id="title">Your image is ready</h1></section>
<section id="empty" hidden><h2>Result unavailable</h2><p id="errorText">This result is no longer available. Please try again.</p><a class="download" href="/image/">Return to Image Tools</a></section>
<section class="results" id="results" aria-live="polite"></section>
<footer class="legal-footer"><nav aria-label="Site information"><a href="/about-us/">About Us</a><span aria-hidden="true">·</span><a href="/contact-us/">Contact Us</a><span aria-hidden="true">·</span><a href="/privacy-policy/">Privacy Policy</a><span aria-hidden="true">·</span><a href="/terms-of-service/">Terms of Service</a></nav><p>© 2026 Walid AI. All rights reserved.</p></footer>
</main>
<script type="module">
import { readResult } from './store.js';
const title=document.querySelector('#title'),holder=document.querySelector('#results');
const empty=document.querySelector('#empty'),errorText=document.querySelector('#errorText'),editMore=document.querySelector('#editMore');
const urls=[];
const titles={'image-resize':'Resized image','image-compress':'Compressed image','image-convert':'Converted image','background-remove':'Background removed','signature-remove':'Signature background removed','watermark-remove':'Selected area edited'};
const routes={'image-resize':'resize-image','image-compress':'compress-image','image-convert':'convert-image','background-remove':'background-remover','signature-remove':'signature-remover','watermark-remove':'watermark-remover'};
function node(tag,cls,value){const element=document.createElement(tag);if(cls)element.className=cls;if(value!==undefined)element.textContent=value;return element}
function preview(item,label,blob){const figure=node('figure');figure.append(node('figcaption','',label));const box=node('div','preview');if(blob instanceof Blob){const img=document.createElement('img');const url=URL.createObjectURL(blob);urls.push(url);img.src=url;img.alt=label+' preview of '+item.name;img.loading='lazy';box.append(img)}else box.append(node('span','muted','Preview unavailable'));figure.append(box);return figure}
async function isEmptyCutout(blob){
  // Validate older browser-saved results as well as new results.
  if(typeof createImageBitmap!=='function')return false;
  const image=await createImageBitmap(blob);
  try{
    const scale=Math.min(1,320/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale));
    canvas.height=Math.max(1,Math.round(image.height*scale));
    const context=canvas.getContext('2d',{willReadFrequently:true});
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const alpha=context.getImageData(0,0,canvas.width,canvas.height).data;
    let opaque=0;
    for(let p=3;p<alpha.length;p+=4)if(alpha[p]>127)opaque++;
    const coverage=opaque/(alpha.length/4);
    return coverage<0.025||coverage>0.95;
  }finally{image.close()}
}
function showError(message){const safe=/^(The result is missing or has expired|The edited image is not available|This image did not separate properly)/.test(String(message||''));empty.hidden=false;errorText.textContent=safe?message:'Could not open this result. Please process your image again.';title.textContent='Result unavailable'}
try {
 const id=new URLSearchParams(location.search).get('id');
 const job=await readResult(id);
 if(!job||!Array.isArray(job.items)||!job.items.length)throw Error('The result is missing or has expired. Please process the image again.');
 title.textContent=job.items.length>1?'Your images are ready':'Your image is ready';
 if(job.tool==='background-remove'){
   for(const item of job.items){
     if(!(item.blob instanceof Blob)||await isEmptyCutout(item.blob))
       throw Error('This image did not separate properly. Please try another photo.');
   }
 }
 if(routes[job.tool])editMore.href='/image/'+routes[job.tool]+'/';
 for(const [index,item] of job.items.entries()){
  if(!(item.blob instanceof Blob))continue;
  const card=node('article','result');
  if(job.items.length>1){const head=node('div','result-head');head.append(node('h2','','Image '+(index+1)));card.append(head)}
  const compare=node('div','compare');compare.append(preview(item,'Before',item.beforeBlob),preview(item,'After',item.blob));card.append(compare);
  const link=node('a','download','Download image');link.href=URL.createObjectURL(item.blob);urls.push(link.href);link.download=item.name||'Walid AI_image.png';card.append(link);holder.append(card);
 }
 if(!holder.children.length)throw Error('The edited image is not available.');
} catch(err){holder.replaceChildren();showError(err.message)}
addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)));
</script></body></html>
