
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8f4">
  <meta name="description" content="Walid AI — বাংলাদেশের AI">
  <title>Walid AI — বাংলাদেশের AI</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --paper: #ffffff;
      --ink: #0d0d0d;
      --muted: #6b6b6b;
      --line: #e5e5e5;
      --green: #111111;
      --green-dark: #000000;
      --mint: #f7f7f7;
      --red: #a73535;
      --shadow: 0 18px 55px #183b2510;
      --field: #ffffff;
      --soft: #f7f7f7;
      --user-bubble: #f4f4f4;
      --ai-bubble: #ffffff;
      --header-line: #ffffff;
      --composer-bg: #ffffff;
      --focus-ring: #00000014;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111713;
      --paper: #1c251f;
      --ink: #e7eee9;
      --muted: #a6b4aa;
      --line: #35443a;
      --green: #65c895;
      --green-dark: #3eaa76;
      --mint: #263e30;
      --red: #ff9292;
      --shadow: 0 18px 55px #0003;
      --field: #202b24;
      --soft: #202b24;
      --user-bubble: #294a37;
      --ai-bubble: #202b24;
      --header-line: #35443a;
      --composer-bg: linear-gradient(145deg, #202b24, #18221b);
      --focus-ring: #65c89525;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    :root[data-theme="dark"] body { background: var(--bg); }

    body { isolation:isolate; }
    body:before {
      content:""; position:fixed; z-index:0;
      left:calc(50% + 125px); top:50%; width:min(68vw,760px); aspect-ratio:1;
      transform:translate(-50%,-50%);
      background:url("kathgolap-logo.png") center/contain no-repeat;
      opacity:.12; pointer-events:none;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .page {
      position:relative;
      z-index:1;
      width: calc(100% - 260px);
      min-height: 100vh;
      margin: 0 0 0 260px;
      padding: 0 32px 24px;
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      width: 248px;
      padding: 22px 16px 16px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      color: #17231d;
      box-shadow: none;
    }
    .side-brand { display:flex; align-items:center; gap:10px; padding:0 8px 22px; }
    .side-brand img { width:40px; height:40px; object-fit:contain; }
    .side-brand strong { display:block; font: bold 20px "Times New Roman", Times, serif; }
    .side-brand .brand-tagline { margin-top:2px; font-size:.68rem; }
    .new-chat { width:100%; padding:10px 12px; border:1px solid #e5e5e5; border-radius:10px; background:#fff; color:#111; text-align:left; font-weight:600; }
    .side-link { width:100%; padding:9px 12px; border:0; border-radius:9px; background:transparent; color:#222; text-align:left; }
    .side-link, .new-chat { display:flex; align-items:center; gap:10px; font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .side-link svg, .new-chat svg { width:19px; height:19px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .side-link:hover { background:#f5f5f5; }
    .history-title { margin:24px 9px 9px; color:#78847d; font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .history-list { flex:1; min-height:0; overflow:auto; }
    .history-item { width:100%; margin:2px 0; padding:9px 10px; overflow:hidden; border:0; border-radius:9px; background:transparent; color:#38443d; text-align:left; text-overflow:ellipsis; white-space:nowrap; }
    .history-item:hover, .new-chat:hover { background:#f5f5f5; }
    .profile { display:flex; align-items:center; gap:10px; padding:14px 7px 3px; border-top:1px solid #e8e8e8; }
    .avatar { display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:50%; background:#eeeeee; color:#222; font-weight:700; }
    .profile-copy { min-width:0; color:#35433a; font-size:.82rem; overflow-wrap:anywhere; }
    .profile-copy small { display:block; color:#849088; font-size:.72rem; }
    .sidebar-login { margin-top:auto; padding:14px 4px 0; border-top:1px solid #e8e8e8; }
    .sidebar-login p { margin:0 0 10px; color:#555; font-size:.82rem; line-height:1.45; }
    .sidebar-login button { width:100%; padding:10px; border:1px solid #d9d9d9; border-radius:999px; background:#fff; color:#111; font-weight:600; }
    .sidebar-language { display:grid; gap:7px; margin:18px 8px 0; color:#69736d; font-size:.8rem; }
    .sidebar-language select { width:100%; padding:9px 10px; border:1px solid #e5e5e5; border-radius:9px; background:#fff; color:#222; }
    .mobile-menu, .sidebar-backdrop { display:none; }

    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 0;
    }
    .page-brand { display:grid; justify-items:center; gap:2px; color:#111; font:700 1.3rem/1 "Times New Roman",Times,serif; letter-spacing:.02em; white-space:nowrap; }
    .page-brand-title { display:flex; align-items:center; justify-content:center; gap:7px; }
    .page-brand-logo { display:none; width:27px; height:27px; object-fit:contain; }
    .page-brand .brand-tagline { margin:0; font-size:.68rem; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 53px;
      height: 48px;
      flex: 0 0 auto;
      display: block;
      overflow: hidden;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-copy { line-height: 1.3; }

    .brand-name {
      font-family: "Times New Roman", Times, serif;
      font-size: 1.08rem;
      font-weight: 850;
      letter-spacing: .045em;
    }

    .brand-name span { color: var(--green); }

    .brand-tagline {
      position: relative;
      isolation: isolate;
      width: max-content;
      font-family: "SolaimanLipi", "Siyam Rupali", serif;
      display: block;
      margin: 3px auto 0;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .tagline-ribbon {
      position: absolute;
      z-index: -1;
      inset: 1px -5px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      overflow: hidden;
      border-radius: 2px;
      opacity: .42;
      animation: ribbon-wave 2.4s ease-in-out infinite;
    }
    .tagline-ribbon i:nth-child(1), .tagline-ribbon i:nth-child(3) { background: #006a4e; }
    .tagline-ribbon i:nth-child(2) { background: #f42a41; }
    @keyframes ribbon-wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(1px); }
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 8px;
      justify-self:end;
    }

    .top-actions button { width: auto; margin: 0; }

    .top-login,
    .theme-toggle {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 650;
    }

    .top-login:hover,
    .theme-toggle:hover {
      background: var(--soft);
      border-color: #9dc3aa;
    }
    .signup-button { padding:10px 16px; border:0; border-radius:999px; background:#111; color:#fff; font-weight:650; }
    .language-select { padding:8px 10px; border:1px solid #e5e5e5; border-radius:9px; background:#fff; color:#222; }

    .account-label {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: .84rem;
    }
    .account-menu-wrap { position:relative; }
    .account-avatar-button { display:grid; place-items:center; width:40px!important; height:40px; padding:0; border:0; border-radius:50%; background:#eee; color:#222; font-weight:700; font-size:1rem; }
    .account-popover { position:absolute; top:calc(100% + 10px); right:0; z-index:20; width:220px; padding:12px; border:1px solid #e5e5e5; border-radius:14px; background:#fff; box-shadow:0 12px 36px #0002; }
    .account-popover-name { margin:2px 4px 10px; overflow-wrap:anywhere; font-size:.88rem; }
    .account-popover .top-login { width:100%; }

    .main {
      width: min(770px, 100%);
      flex: 1;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome {
      margin: 0 0 24px;
      padding: 0;
      text-align: center;
    }

    .welcome h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 400;
      letter-spacing: -.04em;
    }

    .welcome p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .chat {
      flex: 0 1 auto;
      min-height: 0;
      max-height: 55vh;
      margin-bottom: 0;
      overflow: auto;
      padding: 8px 6px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      scroll-behavior: smooth;
    }
    .chat:empty { display:none; }
    .main:has(.chat .msg) { justify-content:flex-end; }
    .main:has(.chat .msg) .chat { flex:1; }

    .msg {
      max-width: 84%;
      margin: 13px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.user {
      margin-left: auto;
      padding: 11px 15px;
      border-radius: 18px 18px 5px 18px;
      background: var(--user-bubble);
      color: var(--ink);
    }

    .msg.ai {
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 17px 17px 17px 5px;
      background: var(--ai-bubble);
    }

    .msg.error { color: var(--red); }

    .source {
      display: block;
      margin-top: 7px;
      color: var(--green);
      font-size: .75rem;
    }

    .answer-table-wrap { max-width: 100%; overflow-x: auto; }

    .answer-table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: .85rem;
    }

    .answer-table th,
    .answer-table td {
      padding: 8px 10px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .answer-table th {
      background: var(--mint);
      color: var(--ink);
    }

    .feedback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .feedback button {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      font-size: .76rem;
    }

    .feedback button:hover {
      border-color: #9dc3aa;
      color: var(--green);
    }

    .feedback textarea {
      flex-basis: 100%;
      min-height: 68px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      resize: vertical;
    }

    .feedback-status {
      color: var(--green);
      font-size: .77rem;
    }

    /* Modern ChatGPT-inspired composer */
    .composer {
      position: relative;
      display:flex;
      align-items:flex-end;
      gap:8px;
      width: 100%;
      margin: 0 auto 0;
      padding: 7px 9px;
      border: 1px solid #d9d9d9;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 2px 8px #0000000a;
    }

    .composer:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 2px #0000000a;
    }

    .composer textarea {
      display: block;
      flex:1;
      width: 100%;
      min-height: 42px;
      height:42px;
      max-height: 140px;
      padding: 9px 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      resize: none;
      overflow-y:hidden;
      line-height: 1.65;
    }

    .composer textarea:focus-visible { outline: none; }

    .composer textarea::placeholder {
      color: var(--muted);
      opacity: .9;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0;
    }

    .composer-hint {
      color: var(--muted);
      font-size: .75rem;
    }

    .primary {
      min-height: 43px;
      padding: 0 19px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-weight: 750;
      white-space: nowrap;
    }

    .primary:hover {
      background: #000;
    }

    .primary:disabled { opacity: .55; cursor: wait; transform: none; }

    .send-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width:40px;
      width:40px;
      height:40px;
      padding:0;
      border-radius:50%;
    }
    .composer-hint { display:none; }

    .send-arrow {
      width:20px;
      height:20px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .hidden { display: none !important; }

    .modal {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #10161178;
      backdrop-filter: blur(5px);
    }

    .login-dialog {
      position: relative;
      width: min(440px, 100%);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      padding: 34px 36px 30px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 30px 90px #0003;
      text-align: center;
    }

    .login-dialog:before {
      content: "";
      position: absolute;
      top: 0;
      left: 40px;
      right: 40px;
      height: 3px;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(90deg, #e6c75d, #4f9e70, #e6c75d);
    }

    .login-close {
      position: absolute;
      right: 17px;
      top: 13px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 1.5rem;
      line-height: 1;
    }

    .login-close:hover { background: var(--soft); }

    .login-dialog h2 {
      margin: 3px 0 8px;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .login-dialog > p {
      max-width: 330px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: .92rem;
    }

    .login-flower {
      width: 56px;
      height: 48px;
      object-fit: contain;
      margin: 0 auto 8px;
    }

    .google-area {
      display: grid;
      justify-content: center;
      min-height: 42px;
      margin: 0 auto 14px;
    }

    .google-area .google-custom {
      width: 320px;
      max-width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 650;
    }

    .google-area .google-custom:hover { background: var(--soft); }

    .login-separator {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 16px 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .login-separator:before,
    .login-separator:after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .email-field {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      outline: none;
      background: var(--field);
      color: var(--ink);
    }

    .email-field:focus,
    .access-row input:focus {
      border-color: #78b393;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .email-action {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      border: 0;
      border-radius: 999px;
      background: #176b4c;
      color: white;
      font-weight: 700;
    }

    .email-action:hover { background: #10583e; }
    .email-action:disabled { opacity: .55; cursor: wait; }

    .login-status {
      min-height: 1.4em;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .82rem;
      overflow-wrap: anywhere;
    }

    .login-owner {
      width: 100%;
      margin-top: 9px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 600;
    }

    .admin-form { margin-top: 14px; text-align: left; }

    .admin-form label {
      display: block;
      margin: 0 0 7px;
      font-size: .9rem;
      font-weight: 650;
    }

    .access-row { display: flex; gap: 9px; }

    .access-row input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: var(--field);
      color: var(--ink);
    }

    .admin-form .access-row { flex-direction: column; }
    .admin-form .primary { width: 100%; }

    .admin-celebration {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 22px;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .admin-celebration.show { opacity: 1; visibility: visible; }
    .admin-welcome-card {
      position: relative;
      z-index: 2;
      width: min(100%, 620px);
      padding: 46px 34px 40px;
      border: 1px solid #eee6c9;
      border-radius: 26px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 80px rgba(35, 29, 8, .15);
      text-align: center;
      transform: translateY(14px) scale(.97);
      transition: transform .45s cubic-bezier(.2,.8,.2,1);
    }
    .admin-celebration.show .admin-welcome-card { transform: translateY(0) scale(1); }
    .admin-welcome-card h2 {
      margin: 0;
      color: #151515;
      font-family: "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 3.35rem);
      font-weight: 700;
      letter-spacing: -.035em;
    }
    .admin-welcome-card p {
      margin: 12px 0 0;
      color: #5c4b1c;
      font-family: "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 600;
    }
    .admin-welcome-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #555;
      font-size: 1.5rem;
    }
    .admin-welcome-close:hover { background: #f5f3eb; }
    .firework {
      position: absolute;
      z-index: 1;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: 0;
      animation: firework-burst 1.8s ease-out infinite;
      pointer-events: none;
    }
    .firework.one {
      top: 28%; left: 20%;
      background: #e6b92e;
      box-shadow: 0 -47px #e6b92e, 33px -33px #e56b58, 47px 0 #e6b92e,
        33px 33px #3a9878, 0 47px #e6b92e, -33px 33px #e56b58,
        -47px 0 #3a9878, -33px -33px #e6b92e;
    }
    .firework.two {
      top: 31%; right: 20%;
      background: #3a9878;
      box-shadow: 0 -42px #3a9878, 30px -30px #e6b92e, 42px 0 #e56b58,
        30px 30px #e6b92e, 0 42px #3a9878, -30px 30px #e56b58,
        -42px 0 #e6b92e, -30px -30px #3a9878;
      animation-delay: .6s;
    }
    .firework.three {
      top: 70%; left: 28%;
      background: #e56b58;
      box-shadow: 0 -36px #e6b92e, 25px -25px #3a9878, 36px 0 #e6b92e,
        25px 25px #e56b58, 0 36px #3a9878, -25px 25px #e6b92e,
        -36px 0 #e56b58, -25px -25px #3a9878;
      animation-delay: 1.1s;
    }
    @keyframes firework-burst {
      0% { transform: scale(.15); opacity: 0; }
      18% { opacity: 1; }
      75%, 100% { transform: scale(1.35); opacity: 0; }
    }

    @media (max-width: 650px) {
      body:before { left:50%; width:min(92vw,520px); opacity:.09; }

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <script>
    "use strict";

    const API = String(window.WALID_AI_API || "").trim().replace(/\/$/, "");

    const loginModal = document.getElementById("loginModal");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logout");
    const accountMenuWrap = document.getElementById("accountMenuWrap");
    const accountAvatar = document.getElementById("accountAvatar");
    const accountPopover = document.getElementById("accountPopover");
    const accountPopoverName = document.getElementById("accountPopoverName");
    const loginStatus = document.getElementById("loginStatus");
    const googleButton = document.getElementById("googleButton");
    const emailInput = document.getElementById("emailInput");
    const emailButton = document.getElementById("emailButton");
    const accessForm = document.getElementById("accessForm");
    const accessKeyInput = document.getElementById("accessKey");
    const accessButton = document.getElementById("accessButton");
    const showAdmin = document.getElementById("showAdmin");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const welcome = document.querySelector(".welcome");
    const languageSelect = document.getElementById("languageSelect");
    const signupBtn = document.getElementById("signupBtn");
    const signedInProfile = document.getElementById("signedInProfile");
    const sidebarLogin = document.getElementById("sidebarLogin");
    const helpModal = document.getElementById("helpModal");
    const profileAvatar = document.getElementById("profileAvatar");
    const profileCopy = document.getElementById("profileCopy");
    const historyList = document.getElementById("historyList");
    const adminCelebration = document.getElementById("adminCelebration");
    const sidebar = document.querySelector(".sidebar");
    const mobileMenu = document.getElementById("mobileMenu");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    let adminCelebrationTimer = null;

    let firestoreDB = null;
    let historyOwner = "";
    let currentConversationId = newConversationId();
    let chatMessages = [];
    let restoringChat = false;
    let persistQueue = Promise.resolve();

    const legacySessionToken = sessionStorage.getItem("walidToken") || "";
    let ACCESS_TOKEN = localStorage.getItem("walidAdminAccess") || sessionStorage.getItem("walidAdminAccess") || "";
    if (!ACCESS_TOKEN && legacySessionToken && legacySessionToken.split(".").length !== 3) {
      ACCESS_TOKEN = legacySessionToken;
    }
    if (ACCESS_TOKEN.split(".").length === 3) {
      localStorage.removeItem("walidAdminAccess");
      ACCESS_TOKEN = "";
    }
    if (ACCESS_TOKEN) localStorage.setItem("walidAdminAccess", ACCESS_TOKEN);
    sessionStorage.removeItem("walidAdminAccess");
    if (legacySessionToken.split(".").length === 3) {
      sessionStorage.removeItem("walidToken");
    }
    let IS_ADMIN = false;
    let firebaseAuth = null;
    let authorizedUid = "";
    let authorizingUid = "";

    function newConversationId() {
      return window.crypto?.randomUUID?.() ||
        "chat-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    }

    function setProfile(name, admin = false) {
      const cleanName = String(name || "Guest").trim() || "Guest";
      profileAvatar.textContent = admin ? "♛" : cleanName.charAt(0).toLocaleUpperCase();
      profileAvatar.setAttribute("aria-label", admin ? "Boss" : cleanName + "-এর প্রোফাইল");
      profileCopy.replaceChildren();
      profileCopy.append(document.createTextNode(admin ? "Boss" : cleanName));
      const note = document.createElement("small");
      note.textContent = admin ? "Whakil Ahamed Shakil" : historyOwner ? "ব্যক্তিগত অ্যাকাউন্ট" : "এই ব্রাউজারে সংরক্ষিত";
      profileCopy.appendChild(note);
      const signedIn = Boolean(ACCESS_TOKEN);
      signedInProfile.classList.toggle("hidden", !signedIn);
      sidebarLogin.classList.toggle("hidden", signedIn);
      accountMenuWrap.classList.toggle("hidden", !signedIn);
      loginBtn.classList.toggle("hidden", signedIn);
      signupBtn.classList.toggle("hidden", signedIn);
      accountAvatar.textContent = admin ? "♛" : cleanName.charAt(0).toLocaleUpperCase();
      accountAvatar.setAttribute("aria-label", admin ? "Boss account menu" : cleanName + " account menu");
      accountPopoverName.textContent = admin ? "Boss · Whakil Ahamed Shakil" : cleanName;
    }

    function showAdminCelebration() {
      if (!IS_ADMIN || !adminCelebration) return;
      window.clearTimeout(adminCelebrationTimer);
      adminCelebration.classList.add("show");
      adminCelebration.setAttribute("aria-hidden", "false");
      adminCelebrationTimer = window.setTimeout(hideAdminCelebration, 6200);
    }

    function hideAdminCelebration() {
      window.clearTimeout(adminCelebrationTimer);
      adminCelebration.classList.remove("show");
      adminCelebration.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeAdminCelebration").addEventListener("click", hideAdminCelebration);

    function drawHistory(records) {
      historyList.replaceChildren();
      records.slice().sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach((record) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        button.textContent = record.title || "নতুন চ্যাট";
        button.addEventListener("click", () => openConversation(record));
        historyList.appendChild(button);
      });
    }

    function guestRecords() {
      try { return JSON.parse(sessionStorage.getItem("walidGuestChats") || "[]"); }
      catch { return []; }
    }

    function accountChatKey(uid) {
      return "walidActiveChatId:" + uid;
    }

    function rememberActiveConversation() {
      if (historyOwner) {
        localStorage.setItem(accountChatKey(historyOwner), currentConversationId);
      } else {
        sessionStorage.setItem("walidActiveChatId", currentConversationId);
      }
    }

    function restoreGuestConversation() {
      const records = guestRecords().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      drawHistory(records);
      const savedId = sessionStorage.getItem("walidActiveChatId");
      const active = records.find((record) => record.id === savedId) || (!savedId ? records[0] : null);
      if (active) {
        openConversation(active);
      } else if (savedId) {
        currentConversationId = savedId;
      }
    }

    function persistConversation() {
      if (restoringChat || !chatMessages.length) return;
      rememberActiveConversation();
      const record = {
        id: currentConversationId,
        title: (chatMessages.find((item) => item.kind === "user")?.text || "নতুন চ্যাট").slice(0, 72),
        messages: chatMessages,
        updatedAt: Date.now()
      };
      const ownerAtSave = historyOwner;
      persistQueue = persistQueue.then(async () => {
        if (ownerAtSave && firestoreDB) {
          await firestoreDB.collection("users").doc(ownerAtSave)
            .collection("chats").doc(record.id).set(record, { merge: true });
        } else {
          const records = guestRecords().filter((item) => item.id !== record.id);
          records.unshift(record);
          sessionStorage.setItem("walidGuestChats", JSON.stringify(records.slice(0, 50)));
        }
        drawHistory(ownerAtSave ? await loadAccountRecords(false) : guestRecords());
      }).catch((error) => console.warn("Chat history could not be saved.", error));
      return persistQueue;
    }

    async function loadAccountRecords(render = true) {
      if (!historyOwner || !firestoreDB) return [];
      const snapshot = await firestoreDB.collection("users").doc(historyOwner).collection("chats").get();
      const records = snapshot.docs.map((doc) => ({ ...doc.data(), id: doc.id }));
      if (render) drawHistory(records);
      return records;
    }

    function openConversation(record) {
      restoringChat = true;
      currentConversationId = record.id;
      chatMessages = Array.isArray(record.messages) ? record.messages : [];
      chat.replaceChildren();
      chatMessages.forEach((item) => addMessage(item.kind, item.text, item.source || ""));
      welcome.classList.toggle("hidden", chatMessages.length > 0);
      restoringChat = false;
      rememberActiveConversation();
    }

    const firebaseConfig = window.WALID_FIREBASE_CONFIG || {};
    const firebaseReady = Boolean(
      firebaseConfig.apiKey &&
      firebaseConfig.authDomain &&
      firebaseConfig.projectId &&
      firebaseConfig.appId
    );

    setProfile("Guest");
    restoreGuestConversation();
    function setLanguage(language) {
      const lang = language === "en" ? "en" : "bn";
      document.documentElement.lang = lang;
      languageSelect.value = lang;
      const text = {
        bn: { newChat:"নতুন চ্যাট", history:"চ্যাটের ইতিহাস", sidebarInfo:"আপনার chat history পেতে লগ ইন করুন।", welcome:"আজ কী জানতে চান?", placeholder:"Walid AI-কে প্রশ্ন করুন...", login:"Log in", signup:"Sign up for free", logout:"Log out", loginDesc:"আপনার Walid AI অ্যাকাউন্টে প্রবেশ করুন।", signupTitle:"নতুন অ্যাকাউন্ট তৈরি করুন", helpText:"মাঝের বক্সে প্রশ্ন লিখে Send চাপুন।", help:"Help", settings:"Settings", language:"ভাষা", tagline:"বাংলাদেশের AI" },
        en: { newChat:"New chat", history:"Recent chats", sidebarInfo:"Log in to access your chat history.", welcome:"Where should we begin?", placeholder:"Ask Walid AI...", login:"Log in", signup:"Sign up for free", logout:"Log out", loginDesc:"Continue to your Walid AI account.", signupTitle:"Create your account", helpText:"Type your question in the box in the middle and press Send.", help:"Help", settings:"Settings", language:"Language", tagline:"Bangladesh AI" }
      }[lang];
      document.querySelector('[data-i18n="newChat"]').textContent = text.newChat;
      document.querySelector('[data-i18n="history"]').textContent = text.history;
      document.querySelector('[data-i18n="sidebarInfo"]').textContent = text.sidebarInfo;
      document.querySelector('[data-i18n="help"]').textContent = text.help;
      document.querySelector('[data-i18n="settings"]').textContent = text.settings;
      document.querySelector('[data-i18n="language"]').textContent = text.language;
      document.querySelectorAll(".brand-tagline").forEach((tagline) => {
        tagline.lastChild.nodeValue = text.tagline;
      });
      document.getElementById("welcomeTitle").textContent = text.welcome;
      input.placeholder = text.placeholder;
      send.setAttribute("aria-label", lang === "bn" ? "পাঠান" : "Send");
      loginBtn.textContent = text.login;
      signupBtn.textContent = text.signup;
      logoutBtn.textContent = text.logout;
      document.getElementById("sidebarLoginBtn").textContent = text.login;
      document.getElementById("loginDescription").textContent = text.loginDesc;
      document.getElementById("helpText").textContent = text.helpText;
      document.getElementById("loginTitle").textContent = loginMode === "signup" ? text.signupTitle : text.login;
      try { localStorage.setItem("walidLanguage", lang); } catch {}
    }

    let loginMode = "login";
    try { languageSelect.value = localStorage.getItem("walidLanguage") || "bn"; } catch { languageSelect.value = "bn"; }
    languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
    setLanguage(languageSelect.value);

    function openLogin(mode = "login") {
      loginMode = mode;
      setLanguage(languageSelect.value);
      loginStatus.textContent = firebaseReady
        ? ""
        : "Google দিয়ে প্রবেশ করা যাবে; ইমেইল প্রবেশের Firebase সেটআপ বাকি।";
      loginModal.classList.remove("hidden");
    }

    document.getElementById("helpBtn").addEventListener("click", () => helpModal.classList.remove("hidden"));
    document.getElementById("settingsBtn").addEventListener("click", () => languageSelect.focus());
    document.getElementById("closeHelp").addEventListener("click", () => helpModal.classList.add("hidden"));
    document.getElementById("sidebarLoginBtn").addEventListener("click", () => openLogin("login"));

    function closeMobileSidebar() {
      sidebar.classList.remove("open");
      sidebarBackdrop.classList.remove("open");
      mobileMenu.setAttribute("aria-expanded", "false");
    }

    mobileMenu.addEventListener("click", () => {
      const opening = !sidebar.classList.contains("open");
      sidebar.classList.toggle("open", opening);
      sidebarBackdrop.classList.toggle("open", opening);
      mobileMenu.setAttribute("aria-expanded", String(opening));
    });
    sidebarBackdrop.addEventListener("click", closeMobileSidebar);
    sidebar.addEventListener("click", (event) => {
      if (event.target.closest("button, .history-item")) closeMobileSidebar();
    });
    accountAvatar.addEventListener("click", () => {
      const opening = accountPopover.classList.contains("hidden");
      accountPopover.classList.toggle("hidden", !opening);
      accountAvatar.setAttribute("aria-expanded", String(opening));
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".account-menu-wrap")) {
        accountPopover.classList.add("hidden");
        accountAvatar.setAttribute("aria-expanded", "false");
      }
    });

    function updateAccountUI(email) {
      loginModal.classList.add("hidden");
      setProfile(firebaseAuth?.currentUser?.displayName || email || "User", IS_ADMIN);
    }

    async function authorize(token, options = {}) {
      if (!API) {
        throw new Error("Walid AI এখন চালু নেই। পরে আবার চেষ্টা করুন।");
      }

      const response = await fetch(API + "/api/hello", {
        headers: { Authorization: "Bearer " + token }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "প্রবেশ করা যায়নি।");
      }

      ACCESS_TOKEN = token;
      IS_ADMIN = data.auth_role === "admin";
      if (IS_ADMIN && token.split(".").length !== 3) localStorage.setItem("walidAdminAccess", token);
      else localStorage.removeItem("walidAdminAccess");
      sessionStorage.removeItem("walidAdminAccess");
      sessionStorage.removeItem("walidToken");

      updateAccountUI(data.email || "");

      if (IS_ADMIN && options.celebrate) showAdminCelebration();
    }

    async function getAuthorizationToken() {
      const user = firebaseAuth?.currentUser;
      if (user && !user.isAnonymous) {
        ACCESS_TOKEN = await user.getIdToken();
      }
      return ACCESS_TOKEN;
    }

    async function useFirebaseUser(user, options = {}) {
      if (
        !user ||
        user.isAnonymous ||
        !user.email ||
        authorizedUid === user.uid ||
        authorizingUid === user.uid
      ) {
        return;
      }

      authorizingUid = user.uid;
      historyOwner = user.uid;
      chat.replaceChildren();
      chatMessages = [];
      welcome.classList.remove("hidden");

      try {
        await authorize(await user.getIdToken(), options);
        setProfile(user.displayName || user.email, IS_ADMIN);
        const records = (await loadAccountRecords(false))
          .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        drawHistory(records);
        const savedId = localStorage.getItem(accountChatKey(user.uid));
        const active = records.find((record) => record.id === savedId) || (!savedId ? records[0] : null);
        if (active) {
          openConversation(active);
        } else {
          currentConversationId = savedId || newConversationId();
          localStorage.setItem(accountChatKey(user.uid), currentConversationId);
          chat.replaceChildren();
          chatMessages = [];
          welcome.classList.remove("hidden");
        }
        authorizedUid = user.uid;
      } catch (error) {
        historyOwner = "";
        loginStatus.textContent = error.message || "প্রবেশ করা যায়নি।";
      } finally {
        authorizingUid = "";
      }
    }

    // Firebase initialization
    if (firebaseReady && window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        firebaseAuth = firebase.auth();
        firestoreDB = firebase.firestore();
        // Firebase Auth's default browser persistence is LOCAL unless changed in Firebase setup.
        emailButton.disabled = false;

        let initialAuthStateHandled = false;
        firebaseAuth.onAuthStateChanged((user) => {
          const isFreshLogin = initialAuthStateHandled;
          initialAuthStateHandled = true;
          if (user && !user.isAnonymous) {
            useFirebaseUser(user, { celebrate: isFreshLogin });
          }
        });

        if (firebaseAuth.isSignInWithEmailLink(window.location.href)) {
          const email = localStorage.getItem("walidEmailForSignIn");

          if (email) {
            firebaseAuth.signInWithEmailLink(email, window.location.href)
              .then(async (result) => {
                localStorage.removeItem("walidEmailForSignIn");
                history.replaceState(
                  {},
                  document.title,
                  window.location.pathname
                );
                await useFirebaseUser(result.user);
              })
              .catch((error) => {
                openLogin();
                loginStatus.textContent =
                  error.message || "ইমেইল লিংকটি ব্যবহার করা যায়নি।";
              });
          } else {
            openLogin();
            loginStatus.textContent =
              "যে ডিভাইসে ইমেইল লিংক চেয়েছিলে, সেখানেই লিংকটি খোলো।";
          }
        }
      } catch (error) {
        emailButton.disabled = true;
        loginStatus.textContent = "ইমেইল প্রবেশ সেটআপ করা যায়নি।";
      }
    } else {
      emailButton.disabled = true;
      loginStatus.textContent =
        "ইমেইল প্রবেশ চালু করতে Firebase সেটআপ বাকি।";
    }

    loginBtn.addEventListener("click", () => openLogin("login"));
    signupBtn.addEventListener("click", () => openLogin("signup"));

    document.getElementById("closeLogin").addEventListener("click", () => {
      loginModal.classList.add("hidden");
    });

    loginModal.addEventListener("click", (event) => {
      if (event.target === loginModal) {
        loginModal.classList.add("hidden");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        loginModal.classList.add("hidden");
      }
    });

    // Email login
    emailButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      loginStatus.textContent = "";

      if (!firebaseAuth) {
        loginStatus.textContent =
          "ইমেইল প্রবেশ চালু করতে Firebase সেটআপ বাকি।";
        return;
      }

      if (!email) {
        loginStatus.textContent = "তোমার ইমেইল ঠিকানা লিখো।";
        emailInput.focus();
        return;
      }

      emailButton.disabled = true;
      emailButton.textContent = "Sending link…";

      try {
        await firebaseAuth.sendSignInLinkToEmail(email, {
          url: window.location.origin + window.location.pathname,
          handleCodeInApp: true
        });

        localStorage.setItem("walidEmailForSignIn", email);
        loginStatus.textContent =
          "ইমেইলে প্রবেশের লিংক পাঠানো হয়েছে। এই ডিভাইসে লিংকটি খোলো।";
      } catch (error) {
        loginStatus.textContent = error.message || "লিংক পাঠানো যায়নি।";
      } finally {
        emailButton.disabled = false;
        emailButton.textContent = "Continue with email";
      }
    });

    // Google login
    const googleClientId =
      String(window.WALID_AI_GOOGLE_CLIENT_ID || "").trim();

    if (firebaseAuth && googleClientId) {
      const googleCta = document.createElement("button");
      googleCta.type = "button";
      googleCta.className = "google-custom";
      googleCta.textContent = "Continue with Google";

      googleCta.addEventListener("click", async () => {
        loginStatus.textContent = "";

        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await firebaseAuth.signInWithPopup(provider);
        } catch (error) {
          loginStatus.textContent =
            error.message || "Google দিয়ে প্রবেশ করা যায়নি।";
        }
      });

      googleButton.appendChild(googleCta);
    } else if (
      googleClientId &&
      window.google &&
      window.google.accounts &&
      window.google.accounts.id
    ) {
      google.accounts.id.initialize({
        client_id: googleClientId,
        callback: async (response) => {
          loginStatus.textContent = "";

          try {
            if (firebaseAuth) {
              const credential =
                firebase.auth.GoogleAuthProvider.credential(
                  response.credential
                );
              const result =
                await firebaseAuth.signInWithCredential(credential);
              await useFirebaseUser(result.user);
            } else {
              await authorize(response.credential);
            }
          } catch (error) {
            loginStatus.textContent =
              error.message || "Google দিয়ে প্রবেশ করা যায়নি।";
          }
        },
        auto_select: false
      });

      google.accounts.id.renderButton(googleButton, {
        type: "standard",
        theme: "outline",
        size: "large",
        text: "continue_with",
        shape: "pill",
        width: 320,
        locale: "en"
      });
    } else {
      googleButton.textContent = "Google sign-in setup required";
    }

    // Admin login
    showAdmin.addEventListener("click", () => {
      accessForm.classList.toggle("hidden");
    });

    accessForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      accessButton.disabled = true;
      accessButton.textContent = "অপেক্ষা করুন…";

      try {
        await authorize(accessKeyInput.value, { celebrate: true });
        accessKeyInput.value = "";
      } catch (error) {
        loginStatus.textContent =
          error.message || "অ্যাক্সেস কোডটি যাচাই করা যায়নি।";
      } finally {
        accessButton.disabled = false;
        accessButton.textContent = "প্রবেশ করুন";
      }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      if (firebaseAuth && firebaseAuth.currentUser) {
        await firebaseAuth.signOut().catch(() => {});
      }

      ACCESS_TOKEN = "";
      IS_ADMIN = false;
      authorizedUid = "";
      authorizingUid = "";
      historyOwner = "";

      sessionStorage.removeItem("walidToken");
      localStorage.removeItem("walidAdminAccess");
      sessionStorage.removeItem("walidAdminAccess");
      sessionStorage.removeItem("walidActiveChatId");

      accountPopover.classList.add("hidden");
      accountAvatar.setAttribute("aria-expanded", "false");
      accountMenuWrap.classList.add("hidden");
      loginBtn.classList.remove("hidden");
      signupBtn.classList.remove("hidden");

      sessionStorage.removeItem("walidGuestChats");
      chat.replaceChildren();
      chatMessages = [];
      welcome.classList.remove("hidden");
      currentConversationId = newConversationId();
      rememberActiveConversation();
      setProfile("Guest");
      drawHistory(guestRecords());
    });

    // Render chat messages safely as text
    function addMessage(kind, text, source = "") {
      const bubble = document.createElement("div");
      bubble.className = "msg " + kind;

      const table = kind === "ai" ? parseMarkdownTable(text) : null;

      if (table) {
        const wrapper = document.createElement("div");
        wrapper.className = "answer-table-wrap";

        const element = document.createElement("table");
        element.className = "answer-table";

        const head = document.createElement("thead");
        const row = document.createElement("tr");

        table.headers.forEach((value) => {
          const cell = document.createElement("th");
          cell.textContent = value;
          row.appendChild(cell);
        });

        head.appendChild(row);
        element.appendChild(head);

        const body = document.createElement("tbody");

        table.rows.forEach((values) => {
          const tr = document.createElement("tr");

          values.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          });

          body.appendChild(tr);
        });

        element.appendChild(body);
        wrapper.appendChild(element);
        bubble.appendChild(wrapper);
      } else {
        const body = document.createElement("span");
        body.textContent = String(text ?? "");
        bubble.appendChild(body);
      }

      if (source) {
        const label = document.createElement("span");
        label.className = "source";
        label.textContent = source;
        bubble.appendChild(label);
      }

      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      if (["user", "ai"].includes(kind)) welcome.classList.add("hidden");

      if (!restoringChat && ["user", "ai"].includes(kind)) {
        chatMessages.push({ kind, text: String(text ?? ""), source });
        void persistConversation();
      }

      return bubble;
    }

    function parseMarkdownTable(text) {
      const lines = String(text).trim()
        .split(/\r?\n/)
        .filter((line) => line.includes("|"));

      if (
        lines.length < 3 ||
        !/^\s*\|?\s*:?-{3,}/.test(lines[1])
      ) {
        return null;
      }

      const parseRow = (line) => line.trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map((cell) => cell.trim().replace(/\\\|/g, "|"));

      return {
        headers: parseRow(lines[0]),
        rows: lines.slice(2).map(parseRow)
      };
    }

    // Admin feedback
    async function saveFeedback(question, answer, box, button) {
      button.disabled = true;

      try {
        const authToken = await getAuthorizationToken();
        const response = await fetch(API + "/api/feedback", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + authToken
          },
          body: JSON.stringify({ question, answer })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "সংশোধন সেভ করা যায়নি।");
        }

        box.replaceChildren();

        const status = document.createElement("span");
        status.className = "feedback-status";
        status.textContent = data.message || "সেভ হয়েছে।";
        box.appendChild(status);
      } catch (error) {
        button.disabled = false;

        const status = document.createElement("span");
        status.className = "feedback-status";
        status.textContent = error.message;
        box.appendChild(status);
      }
    }

    function addFeedback(bubble, question, answer) {
      if (!IS_ADMIN) return;

      const box = document.createElement("div");
      box.className = "feedback";

      const correct = document.createElement("button");
      correct.type = "button";
      correct.textContent = "উত্তর ঠিক";
      correct.addEventListener("click", () => {
        saveFeedback(question, answer, box, correct);
      });

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "সংশোধন দিন";

      edit.addEventListener("click", () => {
        if (box.querySelector("textarea")) return;

        const field = document.createElement("textarea");
        field.placeholder = "সঠিক উত্তরটি লিখুন…";

        const save = document.createElement("button");
        save.type = "button";
        save.textContent = "সেভ করুন";

        save.addEventListener("click", () => {
          if (field.value.trim()) {
            saveFeedback(question, field.value.trim(), box, save);
          }
        });

        box.append(field, save);
        field.focus();
      });

      box.append(correct, edit);
      bubble.appendChild(box);
    }

    function sourceLabel(mode) {
      if (mode === "dataset_lookup") return "";
      if (mode === "pdf_passages") return "PDF থেকে";
      if (mode === "pdf_table") return "PDF-এর টেবিল থেকে";
      if (mode === "not_found") return "তথ্যভাণ্ডারে মেলেনি";

      if (mode === "setup_required" || mode === "ocr_setup_required") {
        return "সেটআপ প্রয়োজন";
      }

      if (mode === "ocr_no_text_found") {
        return "PDF-এ পড়ার মতো লেখা পাওয়া যায়নি";
      }

      if (
        mode === "personal_memory_saved" ||
        mode === "personal_memory"
      ) {
        return "ব্যক্তিগত স্মৃতি";
      }

      return "";
    }

    // Chat submit
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question || send.disabled) return;

      if (!API) {
        addMessage("error", "Walid AI API সেটআপ পাওয়া যায়নি।");
        return;
      }

      addMessage("user", question);
      input.value = "";
      resizeComposer();
      send.disabled = true;

      const headers = { "Content-Type": "application/json" };

      try {
        const authToken = await getAuthorizationToken();
        if (authToken) {
          headers.Authorization = "Bearer " + authToken;
        }

        const response = await fetch(API + "/api/chat", {
          method: "POST",
          headers,
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "উত্তর পাওয়া যায়নি।");
        }

        const answer = addMessage(
          "ai",
          data.answer,
          sourceLabel(data.answering_mode)
        );

        addFeedback(answer, question, data.answer);

        // Show experimental model output in the UI only for admin.
        if (IS_ADMIN && data.model_answer) {
          const draft = addMessage(
            "ai",
            data.model_answer,
            data.model_note || "নিজস্ব মডেলের পরীক্ষামূলক উত্তর"
          );

          addFeedback(draft, question, data.model_answer);
        }
      } catch (error) {
        addMessage(
          "error",
          "উত্তর পাওয়া যায়নি। " +
          (error.message || "আবার চেষ্টা করুন।")
        );
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    function resizeComposer() {
      input.style.height = "42px";
      const nextHeight = Math.min(input.scrollHeight, 140);
      input.style.height = nextHeight + "px";
      input.style.overflowY = input.scrollHeight > 140 ? "auto" : "hidden";
    }

    input.addEventListener("input", resizeComposer);

    document.getElementById("newChat").addEventListener("click", () => {
      currentConversationId = newConversationId();
      rememberActiveConversation();
      chatMessages = [];
      chat.replaceChildren();
      welcome.classList.remove("hidden");
      input.focus();
    });

    // Restore admin access-code session. Firebase users are restored through
    // onAuthStateChanged and receive a fresh ID token there.
    if (ACCESS_TOKEN) {
      authorize(ACCESS_TOKEN).then(() => {
        restoreGuestConversation();
      }).catch(() => {
        ACCESS_TOKEN = "";
        IS_ADMIN = false;
        authorizedUid = "";
        historyOwner = "";

        sessionStorage.removeItem("walidToken");
        localStorage.removeItem("walidAdminAccess");
        sessionStorage.removeItem("walidAdminAccess");
        loginBtn.classList.remove("hidden");
        signupBtn.classList.remove("hidden");
        accountMenuWrap.classList.add("hidden");
        setProfile("Guest");
      });
    }
  </script>
</body>
</html>
