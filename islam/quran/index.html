<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন — ১১৪টি সূরা | Walid AI</title><meta name="description" content="আল-কুরআনের ১১৪টি সূরা পড়ুন। আরবি আয়াত ও বাংলা অনুবাদ।"><link rel="canonical" href="https://walid-ai.com/islam/quran/"><style>body{font:18px/1.7 system-ui,sans-serif;background:#f8fbf8;color:#183a2c;margin:0}main{max-width:950px;margin:auto;padding:20px}a{color:#116448}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{display:block;background:white;padding:15px;border:1px solid #d9e6dd;border-radius:12px;text-decoration:none}.item small{display:block;color:#64786b}input{padding:12px;width:100%;box-sizing:border-box;margin:16px 0;font:inherit}#status{color:#675b42}</style></head><body><main><nav><a href="/islam/">আল-কুরআন ও ইসলাম</a></nav><h1>আল-কুরআন: ১১৪টি সূরা</h1><p>সূরা নির্বাচন করে আরবি আয়াত ও বাংলা অনুবাদ পড়ুন। অনলাইন উৎস উপলব্ধ না থাকলে কোনো আয়াত অনুমান করে দেখানো হবে না।</p><label for="search">সূরা খুঁজুন</label><input id="search" type="search" placeholder="সূরার নাম বা নম্বর"><p id="status" role="status">সূরার তালিকা লোড হচ্ছে…</p><div id="list" class="grid"></div></main><script>const list=document.querySelector('#list'),status=document.querySelector('#status'),search=document.querySelector('#search');let surahs=[];const slug=n=>n===1?'al-fatiha':'surah-'+n;function render(){const q=search.value.trim().toLowerCase();list.replaceChildren();for(const s of surahs.filter(s=>(s.number+' '+s.englishName+' '+s.name).toLowerCase().includes(q))){const a=document.createElement('a');a.className='item';a.href='/islam/quran/'+slug(s.number)+'/';const title=document.createElement('strong');title.textContent=s.number+'. '+s.englishName;const small=document.createElement('small');small.textContent=s.name+' · '+s.numberOfAyahs+' আয়াত';a.append(title,small);list.append(a)}}search.addEventListener('input',render);fetch('https://api.alquran.cloud/v1/meta').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{surahs=d.data.surahs.references;if(surahs.length!==114)throw Error('Unexpected count');status.textContent='মোট ১১৪টি সূরা';render()}).catch(()=>status.textContent='এখন সূরার তালিকা পাওয়া যাচ্ছে না। পরে আবার চেষ্টা করুন।');</script></body></html>
