<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সূরা পাঠ | Walid AI</title><meta name="description" content="আল-কুরআনের আরবি আয়াত ও বাংলা অর্থ পড়ুন।"><style>body{margin:0;background:#f8fbf8;color:#18382b;font:18px/1.75 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:18px}a{color:#166345}.ayah{background:#fff;border:1px solid #dce8df;border-radius:12px;margin:15px 0;padding:18px}.arabic{font:normal 2rem/2.2 serif;direction:rtl;text-align:right;color:#143d30}.translation{margin-top:12px}.number{color:#597263;font-size:.9rem}.notice{background:#fff5df;padding:12px;border-radius:9px}button{padding:10px}</style></head><body><main><nav><a href="/islam/quran/">← সব সূরা</a></nav><h1 id="title">সূরা লোড হচ্ছে…</h1><p id="status" role="status">আরবি পাঠ ও বাংলা অর্থ আনা হচ্ছে…</p><p class="notice">বাংলা উচ্চারণ এখনো যাচাইকৃতভাবে সংযুক্ত হয়নি। ভুল উচ্চারণ তৈরি করে দেখানোর পরিবর্তে এটি আপাতত বাদ রাখা হয়েছে। বাংলা অনুবাদ উৎসের অনুবাদ; মূল আরবি পাঠই প্রামাণ্য।</p><section id="verses"></section><p><a href="/islam/quran/">সব সূরার তালিকায় ফিরুন</a></p></main><script>const n=Number(new URLSearchParams(location.search).get('surah')||document.body.dataset.surah||1);const status=document.querySelector('#status'),title=document.querySelector('#title'),verses=document.querySelector('#verses');if(!Number.isInteger(n)||n<1||n>114){status.textContent='সূরার নম্বর সঠিক নয়';throw Error('Invalid surah')}async function get(url){const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(data.code!==200||!data.data)throw Error('Invalid data');return data.data}Promise.all([get('https://api.alquran.cloud/v1/surah/'+n+'/ar.alafasy'),get('https://api.alquran.cloud/v1/surah/'+n+'/bn.bengali')]).then(([arabic,bangla])=>{if(arabic.ayahs.length!==bangla.ayahs.length)throw Error('Verse count mismatch');title.textContent='সূরা '+arabic.englishName+' — '+arabic.name;document.title='সূরা '+arabic.englishName+' বাংলা অর্থ | Walid AI';status.textContent=arabic.numberOfAyahs+' আয়াত · আরবি পাঠ ও বাংলা অর্থ';const fragment=document.createDocumentFragment();arabic.ayahs.forEach((a,i)=>{const section=document.createElement('article');section.className='ayah';const number=document.createElement('div');number.className='number';number.textContent='আয়াত '+a.numberInSurah;const ar=document.createElement('div');ar.className='arabic';ar.lang='ar';ar.dir='rtl';ar.textContent=a.text;const bn=document.createElement('p');bn.className='translation';bn.textContent=bangla.ayahs[i].text;section.append(number,ar,bn);fragment.append(section)});verses.replaceChildren(fragment)}).catch(e=>{status.textContent='এখন সূরার পাঠ পাওয়া যাচ্ছে না। পরে আবার চেষ্টা করুন।';console.error(e)});</script></body></html>
