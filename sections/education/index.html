--green);border-radius:5px}footer{margin-top:45px;border-top:1px solid var(--line);padding-top:20px;text-align:center;font-size:.9rem}footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}.hide{display:none!important}@media(max-width:600px){.panel{padding:16px}main{padding:14px 14px 40px}} </style><link rel="stylesheet" href="/walid-legal.css"></head><body><main><header><a href="/"><img src="/walid-ai-approved-logo.png" alt="Walid AI"></a><a class="back" href="/">মূল পাতা</a></header><h1>Education</h1><p class="muted">ষষ্ঠ থেকে দ্বাদশ শ্রেণির জন্য বিনামূল্যের MCQ Practice ও Study Notes। কোনো লগইন বা পেইড API প্রয়োজন নেই।</p><p class="muted">এটি একটি প্রাথমিক শিক্ষামূলক সংগ্রহ; সম্পূর্ণ পাঠ্যবই বা সব অধ্যায়ের বিকল্প নয়।</p><div class="tabs" role="tablist" aria-label="Education tools"><button class="tab" id="quizTab" role="tab" aria-selected="true" aria-controls="quizPanel">MCQ Practice</button><button class="tab" id="notesTab" role="tab" aria-selected="false" aria-controls="notesPanel">Study Notes</button></div><div class="controls"><label>শ্রেণি<select id="grade"></select></label><label>বিষয়<select id="subject"></select></label></div><section id="quizPanel" role="tabpanel" aria-labelledby="quizTab"><div class="panel"><div id="quiz"></div><div class="actions"><button class="primary" id="next" hidden>পরের প্রশ্ন</button><button id="restart">আবার শুরু</button></div></div></section><section id="notesPanel" class="hide" role="tabpanel" aria-labelledby="notesTab"><div id="notes"></div></section><footer class="legal-footer"><nav aria-label="Site information"><a href="/about-us/">About Us</a><a href="/contact-us/">Contact Us</a><a href="/privacy-policy/">Privacy Policy</a><a href="/terms-of-service/">Terms of Service</a></nav><p>© 2026 Walid AI. All rights reserved.</p></footer></main><script>const DB={"notes":[{"id":1,"grade":6,"subject":"গণিত","title":"ভগ্নাংশের ধারণা","body":"ভগ্নাংশে লব উপরে এবং হর নিচে থাকে। হর শূন্য হতে পারে না। যেমন ৩/৪ অর্থ সমান চার ভাগের তিন ভাগ।","example":"সমহর ভগ্নাংশ যোগ করতে লব যোগ করে হর অপরিবর্তিত রাখি: ১/৫ + ২/৫ = ৩/৫।"},{"id":2,"grade":6,"subject":"বিজ্ঞান","title":"খাদ্যশৃঙ্খল","body":"খাদ্যশৃঙ্খলে এক জীব থেকে অন্য জীবে খাদ্যের মাধ্যমে শক্তি স্থানান্তরিত হয়। সবুজ উদ্ভিদ সূর্যের আলো ব্যবহার করে খাদ্য তৈরি করে।","example":"ঘাস → ঘাসফড়িং → ব্যাঙ → সাপ একটি সরল উদাহরণ।"},{"id":3,"grade":7,"subject":"গণিত","title":"শতকরা হিসাব","body":"শতকরা মানে প্রতি একশতে কত। কোনো সংখ্যার p% বের করতে সংখ্যাটিকে p/100 দিয়ে গুণ করতে হয়।","example":"২০০ টাকার ১৫% = ২০০ × ১৫/১০০ = ৩০ টাকা।"},{"id":4,"grade":7,"subject":"বিজ্ঞান","title":"সালোকসংশ্লেষণ","body":"সবুজ উদ্ভিদ সূর্যালোক, পানি ও কার্বন ডাই-অক্সাইড ব্যবহার করে শর্করা তৈরি করে এবং অক্সিজেন ছাড়ে।","example":"উদ্ভিদের পাতার ক্লোরোফিল আলো শোষণে সাহায্য করে।"},{"id":5,"grade":8,"subject":"গণিত","title":"সরল সমীকরণ","body":"সমীকরণের দুই পাশ সমান থাকে। অজানা রাশির মান বের করতে উভয় পাশে একই গাণিতিক কাজ করা যায়।","example":"x + ৭ = ১২ হলে উভয় পাশ থেকে ৭ বিয়োগ করে x = ৫।"},{"id":6,"grade":8,"subject":"বিজ্ঞান","title":"বল ও গতি","body":"বল কোনো বস্তুর গতির অবস্থা বা আকৃতি পরিবর্তন করতে পারে। বলের SI একক নিউটন।","example":"স্থির বলকে ঠেলা দিলে সেটি চলতে শুরু করতে পারে।"},{"id":7,"grade":9,"subject":"গণিত","title":"সূচকের নিয়ম","body":"একই ভিত্তির ঘাত গুণ করলে সূচক যোগ হয়: a^m × a^n = a^(m+n)। এখানে a শূন্য না হলেও গুণের নিয়মটি প্রযোজ্য।","example":"২³ × ২² = ২⁵ = ৩২।"},{"id":8,"grade":9,"subject":"বিজ্ঞান","title":"কোষের পরিচয়","body":"কোষ জীবদেহের গঠন ও কাজের মৌলিক একক। উদ্ভিদকোষে সাধারণত কোষপ্রাচীর থাকে, প্রাণিকোষে থাকে না।","example":"উদ্ভিদকোষের ক্লোরোপ্লাস্টে সালোকসংশ্লেষণ ঘটে।"},{"id":9,"grade":10,"subject":"গণিত","title":"দ্বিঘাত সমীকরণ","body":"ax² + bx + c = 0 (a ≠ 0) আকারের সমীকরণকে দ্বিঘাত সমীকরণ বলে। উৎপাদকে বিশ্লেষণ করে অনেক সমীকরণ সমাধান করা যায়।","example":"x² − ৫x + ৬ = ০ ⇒ (x−২)(x−৩)=০ ⇒ x=২ বা ৩।"},{"id":10,"grade":10,"subject":"বিজ্ঞান","title":"ওহমের সূত্র","body":"তাপমাত্রাসহ ভৌত অবস্থা অপরিবর্তিত থাকলে কোনো ওহমিক পরিবাহীতে বিভব পার্থক্য তড়িৎপ্রবাহের সমানুপাতিক: V = IR।","example":"R = ২ Ω এবং I = ৩ A হলে V = ৬ V।"},{"id":11,"grade":11,"subject":"গণিত","title":"ফাংশনের ধারণা","body":"ফাংশনে ডোমেইনের প্রতিটি উপাদানের জন্য কোডোমেইনে ঠিক একটি নির্দিষ্ট মান থাকে। f(x)=2x+1 একটি ফাংশনের উদাহরণ।","example":"f(৩) = ২×৩ + ১ = ৭।"},{"id":12,"grade":11,"subject":"পদার্থবিজ্ঞান","title":"বেগ ও ত্বরণ","body":"বেগ হলো সময়ের সঙ্গে সরণের পরিবর্তনের হার। ত্বরণ হলো সময়ের সঙ্গে বেগের পরিবর্তনের হার।","example":"বেগ ০ থেকে ১০ m/s হতে ৫ s লাগলে গড় ত্বরণ = ২ m/s²।"},{"id":13,"grade":12,"subject":"গণিত","title":"অন্তরকের প্রাথমিক নিয়ম","body":"x-এর সাপেক্ষে xⁿ-এর অন্তরক nxⁿ⁻¹, যেখানে n ধ্রুবক। অন্তরক তাৎক্ষণিক পরিবর্তনের হার প্রকাশ করে।","example":"d(x³)/dx = ৩x²।"},{"id":14,"grade":12,"subject":"পদার্থবিজ্ঞান","title":"বৈদ্যুতিক ক্ষমতা","body":"বৈদ্যুতিক ক্ষমতা হলো একক সময়ে বৈদ্যুতিক শক্তি ব্যবহারের হার। P = VI; একক ওয়াট।","example":"২২০ V-এ ০.৫ A প্রবাহ হলে ক্ষমতা ১১০ W।"}],"questions":[{"id":1,"grade":6,"subject":"গণিত","q":"৩/৫ + ১/৫ কত? ","options":["৪/১০","৪/৫","৩/১০","২/৫"],"answer":1,"why":"সমহর ভগ্নাংশে লব যোগ হয়: (৩+১)/৫ = ৪/৫।"},{"id":2,"grade":6,"subject":"গণিত","q":"ভগ্নাংশের হর কোনটি?","options":["উপরের সংখ্যা","নিচের সংখ্যা","যোগফল","গুণফল"],"answer":1,"why":"a/b ভগ্নাংশে b হলো হর।"},{"id":3,"grade":6,"subject":"বিজ্ঞান","q":"খাদ্যশৃঙ্খলে উৎপাদক সাধারণত কে?","options":["ব্যাঙ","সাপ","সবুজ উদ্ভিদ","বাঘ"],"answer":2,"why":"সবুজ উদ্ভিদ নিজেই খাদ্য তৈরি করে।"},{"id":4,"grade":6,"subject":"বিজ্ঞান","q":"উদ্ভিদ প্রধানত কোন শক্তি ব্যবহার করে খাদ্য তৈরি করে?","options":["শব্দ","সূর্যালোক","তাপমাত্রা","চুম্বক"],"answer":1,"why":"সালোকসংশ্লেষণে আলোকশক্তি ব্যবহৃত হয়।"},{"id":5,"grade":7,"subject":"গণিত","q":"২০০-এর ১৫% কত?","options":["১৫","২০","৩০","৪০"],"answer":2,"why":"২০০ × ১৫/১০০ = ৩০।"},{"id":6,"grade":7,"subject":"গণিত","q":"শতকরা অর্থ কী?","options":["প্রতি দশে","প্রতি একশতে","প্রতি হাজারে","প্রতি একে"],"answer":1,"why":"শতকরা = প্রতি ১০০-তে।"},{"id":7,"grade":7,"subject":"বিজ্ঞান","q":"সালোকসংশ্লেষণে উদ্ভিদ কোন গ্যাস গ্রহণ করে?","options":["অক্সিজেন","নাইট্রোজেন","কার্বন ডাই-অক্সাইড","হাইড্রোজেন"],"answer":2,"why":"উদ্ভিদ কার্বন ডাই-অক্সাইড ব্যবহার করে।"},{"id":8,"grade":7,"subject":"বিজ্ঞান","q":"ক্লোরোফিলের প্রধান কাজ কী?","options":["পানি শোষণ","আলো শোষণ","মাটি তৈরি","বীজ ছড়ানো"],"answer":1,"why":"ক্লোরোফিল আলোকশক্তি শোষণ করে।"},{"id":9,"grade":8,"subject":"গণিত","q":"x + ৭ = ১২ হলে x কত?","options":["৩","৪","৫","৬"],"answer":2,"why":"উভয় পাশ থেকে ৭ বিয়োগ করলে x = ৫।"},{"id":10,"grade":8,"subject":"গণিত","q":"সমীকরণের উভয় পাশে একই সংখ্যা যোগ করলে কী হয়?","options":["সমতা বজায় থাকে","সমতা নষ্ট হয়","সবসময় শূন্য হয়","দুই পাশ বদলে যায়"],"answer":0,"why":"একই কাজ করলে দুই পাশের সমতা বজায় থাকে।"},{"id":11,"grade":8,"subject":"বিজ্ঞান","q":"বলের SI একক কী?","options":["জুল","নিউটন","ওয়াট","মিটার"],"answer":1,"why":"বলের SI একক নিউটন।"},{"id":12,"grade":8,"subject":"বিজ্ঞান","q":"বল প্রয়োগে কী পরিবর্তন হতে পারে?","options":["শুধু রং","গতি বা আকৃতি","শুধু ভর","শুধু পদার্থের নাম"],"answer":1,"why":"বল গতি বা আকৃতি পরিবর্তন করতে পারে।"},{"id":13,"grade":9,"subject":"গণিত","q":"২³ × ২² কত?","options":["১৬","২৪","৩২","৬৪"],"answer":2,"why":"একই ভিত্তিতে সূচক যোগ: ২⁵ = ৩২।"},{"id":14,"grade":9,"subject":"গণিত","q":"a² × a³ সমান কী?","options":["a⁶","a⁵","a¹","2a⁵"],"answer":1,"why":"সূচক যোগ করলে a⁵।"},{"id":15,"grade":9,"subject":"বিজ্ঞান","q":"জীবদেহের মৌলিক গঠনগত একক কী?","options":["অঙ্গ","টিস্যু","কোষ","অঙ্গতন্ত্র"],"answer":2,"why":"কোষ হলো মৌলিক গঠনগত একক।"},{"id":16,"grade":9,"subject":"বিজ্ঞান","q":"সাধারণত উদ্ভিদকোষে থাকে কিন্তু প্রাণিকোষে থাকে না কোনটি?","options":["কোষঝিল্লি","সাইটোপ্লাজম","কোষপ্রাচীর","নিউক্লিয়াস"],"answer":2,"why":"উদ্ভিদকোষে কোষপ্রাচীর থাকে।"},{"id":17,"grade":10,"subject":"গণিত","q":"x² − ৫x + ৬ = ০ এর মূল কোন জোড়া?","options":["১,৬","২,৩","−২,−৩","০,৫"],"answer":1,"why":"(x−২)(x−৩)=০।"},{"id":18,"grade":10,"subject":"গণিত","q":"দ্বিঘাত সমীকরণে x-এর সর্বোচ্চ ঘাত কত?","options":["১","২","৩","৪"],"answer":1,"why":"দ্বিঘাত সমীকরণে সর্বোচ্চ ঘাত ২।"},{"id":19,"grade":10,"subject":"বিজ্ঞান","q":"ওহমের সূত্র কোনটি?","options":["P=VI","V=IR","F=ma","v=u+at"],"answer":1,"why":"ওহমিক পরিবাহীতে নির্দিষ্ট ভৌত অবস্থায় V=IR।"},{"id":20,"grade":10,"subject":"বিজ্ঞান","q":"রোধের SI একক কী?","options":["ওহম","অ্যাম্পিয়ার","ভোল্ট","ওয়াট"],"answer":0,"why":"রোধের একক ওহম (Ω)।"},{"id":21,"grade":11,"subject":"গণিত","q":"f(x)=2x+1 হলে f(3) কত?","options":["৫","৬","৭","৮"],"answer":2,"why":"২×৩+১ = ৭।"},{"id":22,"grade":11,"subject":"গণিত","q":"ফাংশনে ডোমেইনের একটি উপাদানের জন্য কতটি নির্দিষ্ট আউটপুট থাকে?","options":["শূন্যটি","ঠিক একটি","অবশ্যই দুটি","অসীম"],"answer":1,"why":"প্রতিটি ইনপুটের ঠিক একটি আউটপুট নির্ধারিত থাকে।"},{"id":23,"grade":11,"subject":"পদার্থবিজ্ঞান","q":"ত্বরণের SI একক কোনটি?","options":["m/s","m/s²","kg","N"],"answer":1,"why":"ত্বরণ হলো প্রতি সেকেন্ডে বেগের পরিবর্তন।"},{"id":24,"grade":11,"subject":"পদার্থবিজ্ঞান","q":"বেগের পরিবর্তনের হার কী?","options":["সরণ","দূরত্ব","ত্বরণ","ভর"],"answer":2,"why":"সময়ের সঙ্গে বেগের পরিবর্তনের হার ত্বরণ।"},{"id":25,"grade":12,"subject":"গণিত","q":"d(x³)/dx কত?","options":["x²","২x","৩x²","৩x"],"answer":2,"why":"ঘাতের নিয়মে ৩x²।"},{"id":26,"grade":12,"subject":"গণিত","q":"d(x²)/dx কত?","options":["২x","x","২","x³"],"answer":0,"why":"ঘাতের নিয়মে ২x।"},{"id":27,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"বৈদ্যুতিক ক্ষমতার একক কী?","options":["জুল","ওয়াট","ভোল্ট","ওহম"],"answer":1,"why":"ক্ষমতার SI একক ওয়াট।"},{"id":28,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"P=VI; V=১০ V, I=২ A হলে P কত?","options":["৫ W","১০ W","২০ W","১২ W"],"answer":2,"why":"১০×২ = ২০ W।"}]};const grade=document.getElementById('grade'),subject=document.getElementById('subject'),quiz=document.getElementById('quiz'),notes=document.getElementById('notes'),next=document.getElementById('next');let list=[],position=0,score=0,answered=false;function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function showTab(which){const isQuiz=which==='quiz';document.getElementById('quizPanel').classList.toggle('hide',!isQuiz);document.getElementById('notesPanel').classList.toggle('hide',isQuiz);document.getElementById('quizTab').setAttribute('aria-selected',String(isQuiz));document.getElementById('notesTab').setAttribute('aria-selected',String(!isQuiz))}document.getElementById('quizTab').onclick=()=>showTab('quiz');document.getElementById('notesTab').onclick=()=>showTab('notes');for(let g=6;g<=12;g++)grade.add(new Option('শ্রেণি '+g,g));function fillSubjects(){const g=Number(grade.value);const subjects=[...new Set([...DB.notes,...DB.questions].filter(x=>x.grade===g).map(x=>x.subject))];subject.replaceChildren(...subjects.map(x=>new Option(x,x)));refresh()}function refresh(){list=DB.questions.filter(x=>x.grade===Number(grade.value)&&x.subject===subject.value);position=0;score=0;renderQuiz();renderNotes()}grade.onchange=fillSubjects;subject.onchange=refresh;document.getElementById('restart').onclick=refresh;function renderQuiz(){quiz.replaceChildren();next.hidden=true;answered=false;if(!list.length){quiz.append(el('p','এই বিষয়ে এখনো প্রশ্ন যোগ করা হয়নি।'));return}if(position>=list.length){quiz.append(el('h2','অনুশীলন শেষ!'));quiz.append(el('p','আপনার স্কোর: '+score+' / '+list.length));return}const q=list[position];quiz.append(el('p','প্রশ্ন '+(position+1)+' / '+list.length,'muted'));quiz.append(el('h2',q.q));const opts=el('div',undefined,'options');const explanation=el('div');q.options.forEach((op,i)=>{const b=el('button',(i+1)+'. '+op);b.onclick=()=>{if(answered)return;answered=true;if(i===q.answer)score++;[...opts.children].forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('correct');else if(j===i)x.classList.add('wrong')});explanation.append(el('p',(i===q.answer?'সঠিক উত্তর! ':'ভুল উত্তর। ')+q.why));next.hidden=false;next.textContent=position===list.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন'};opts.append(b)});quiz.append(opts,explanation)}next.onclick=()=>{if(!answered)return;position++;renderQuiz()};function renderNotes(){notes.replaceChildren();const rows=DB.notes.filter(x=>x.grade===Number(grade.value)&&x.subject===subject.value);if(!rows.length){notes.append(el('p','এই বিষয়ে নোট এখনো যোগ করা হয়নি।'));return}rows.forEach(x=>{const a=el('article',undefined,'note');a.append(el('h2',x.title),el('p',x.body),el('p','উদাহরণ: '+x.example,'example'));notes.append(a)})}fillSubjects();</script></body></html>
