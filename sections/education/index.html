হর অপরিবর্তিত রাখি: ১/৫ + ২/৫ = ৩/৫।"},{"id":2,"grade":6,"subject":"বিজ্ঞান","title":"খাদ্যশৃঙ্খল","body":"খাদ্যশৃঙ্খলে এক জীব থেকে অন্য জীবে খাদ্যের মাধ্যমে শক্তি স্থানান্তরিত হয়। সবুজ উদ্ভিদ সূর্যের আলো ব্যবহার করে খাদ্য তৈরি করে।","example":"ঘাস → ঘাসফড়িং → ব্যাঙ → সাপ একটি সরল উদাহরণ।"},{"id":3,"grade":7,"subject":"গণিত","title":"শতকরা হিসাব","body":"শতকরা মানে প্রতি একশতে কত। কোনো সংখ্যার p% বের করতে সংখ্যাটিকে p/100 দিয়ে গুণ করতে হয়।","example":"২০০ টাকার ১৫% = ২০০ × ১৫/১০০ = ৩০ টাকা।"},{"id":4,"grade":7,"subject":"বিজ্ঞান","title":"সালোকসংশ্লেষণ","body":"সবুজ উদ্ভিদ সূর্যালোক, পানি ও কার্বন ডাই-অক্সাইড ব্যবহার করে শর্করা তৈরি করে এবং অক্সিজেন ছাড়ে।","example":"উদ্ভিদের পাতার ক্লোরোফিল আলো শোষণে সাহায্য করে।"},{"id":5,"grade":8,"subject":"গণিত","title":"সরল সমীকরণ","body":"সমীকরণের দুই পাশ সমান থাকে। অজানা রাশির মান বের করতে উভয় পাশে একই গাণিতিক কাজ করা যায়।","example":"x + ৭ = ১২ হলে উভয় পাশ থেকে ৭ বিয়োগ করে x = ৫।"},{"id":6,"grade":8,"subject":"বিজ্ঞান","title":"বল ও গতি","body":"বল কোনো বস্তুর গতির অবস্থা বা আকৃতি পরিবর্তন করতে পারে। বলের SI একক নিউটন।","example":"স্থির বলকে ঠেলা দিলে সেটি চলতে শুরু করতে পারে।"},{"id":7,"grade":9,"subject":"গণিত","title":"সূচকের নিয়ম","body":"একই ভিত্তির ঘাত গুণ করলে সূচক যোগ হয়: a^m × a^n = a^(m+n)। এখানে a শূন্য না হলেও গুণের নিয়মটি প্রযোজ্য।","example":"২³ × ২² = ২⁵ = ৩২।"},{"id":8,"grade":9,"subject":"বিজ্ঞান","title":"কোষের পরিচয়","body":"কোষ জীবদেহের গঠন ও কাজের মৌলিক একক। উদ্ভিদকোষে সাধারণত কোষপ্রাচীর থাকে, প্রাণিকোষে থাকে না।","example":"উদ্ভিদকোষের ক্লোরোপ্লাস্টে সালোকসংশ্লেষণ ঘটে।"},{"id":9,"grade":10,"subject":"গণিত","title":"দ্বিঘাত সমীকরণ","body":"ax² + bx + c = 0 (a ≠ 0) আকারের সমীকরণকে দ্বিঘাত সমীকরণ বলে। উৎপাদকে বিশ্লেষণ করে অনেক সমীকরণ সমাধান করা যায়।","example":"x² − ৫x + ৬ = ০ ⇒ (x−২)(x−৩)=০ ⇒ x=২ বা ৩।"},{"id":10,"grade":10,"subject":"বিজ্ঞান","title":"ওহমের সূত্র","body":"তাপমাত্রাসহ ভৌত অবস্থা অপরিবর্তিত থাকলে কোনো ওহমিক পরিবাহীতে বিভব পার্থক্য তড়িৎপ্রবাহের সমানুপাতিক: V = IR।","example":"R = ২ Ω এবং I = ৩ A হলে V = ৬ V।"},{"id":11,"grade":11,"subject":"গণিত","title":"ফাংশনের ধারণা","body":"ফাংশনে ডোমেইনের প্রতিটি উপাদানের জন্য কোডোমেইনে ঠিক একটি নির্দিষ্ট মান থাকে। f(x)=2x+1 একটি ফাংশনের উদাহরণ।","example":"f(৩) = ২×৩ + ১ = ৭।"},{"id":12,"grade":11,"subject":"পদার্থবিজ্ঞান","title":"বেগ ও ত্বরণ","body":"বেগ হলো সময়ের সঙ্গে সরণের পরিবর্তনের হার। ত্বরণ হলো সময়ের সঙ্গে বেগের পরিবর্তনের হার।","example":"বেগ ০ থেকে ১০ m/s হতে ৫ s লাগলে গড় ত্বরণ = ২ m/s²।"},{"id":13,"grade":12,"subject":"গণিত","title":"অন্তরকের প্রাথমিক নিয়ম","body":"x-এর সাপেক্ষে xⁿ-এর অন্তরক nxⁿ⁻¹, যেখানে n ধ্রুবক। অন্তরক তাৎক্ষণিক পরিবর্তনের হার প্রকাশ করে।","example":"d(x³)/dx = ৩x²।"},{"id":14,"grade":12,"subject":"পদার্থবিজ্ঞান","title":"বৈদ্যুতিক ক্ষমতা","body":"বৈদ্যুতিক ক্ষমতা হলো একক সময়ে বৈদ্যুতিক শক্তি ব্যবহারের হার। P = VI; একক ওয়াট।","example":"২২০ V-এ ০.৫ A প্রবাহ হলে ক্ষমতা ১১০ W।"},{"id":15,"grade":6,"subject":"গণিত","title":"দশমিক ভগ্নাংশ","body":"দশমিক সংখ্যা স্থানমান দিয়ে প্রকাশ করা হয়। দশমিকের ডানে প্রথম অঙ্ক দশমাংশ, দ্বিতীয় অঙ্ক শতাংশ।","example":"০.২৫ = ২৫/১০০ = ১/৪।"},{"id":16,"grade":6,"subject":"গণিত","title":"পরিসীমা","body":"কোনো বদ্ধ আকৃতির চারপাশের মোট দৈর্ঘ্যকে পরিসীমা বলে। বর্গের চার বাহু সমান।","example":"বাহু ৬ সেমি হলে বর্গের পরিসীমা ২৪ সেমি।"},{"id":17,"grade":6,"subject":"বিজ্ঞান","title":"পদার্থের অবস্থা","body":"পদার্থ সাধারণত কঠিন, তরল ও গ্যাসীয় অবস্থায় দেখা যায়। তাপমাত্রা ও চাপ পরিবর্তনে অবস্থা বদলাতে পারে।","example":"বরফ গলে পানি হয়, পানি বাষ্পীভূত হয়ে জলীয় বাষ্প হয়।"},{"id":18,"grade":6,"subject":"বিজ্ঞান","title":"চুম্বক","body":"চুম্বকের উত্তর ও দক্ষিণ মেরু থাকে। সমমেরু বিকর্ষণ করে, বিপরীত মেরু আকর্ষণ করে।","example":"দুটি চুম্বকের উত্তর মেরু কাছে আনলে বিকর্ষণ দেখা যায়।"},{"id":19,"grade":7,"subject":"গণিত","title":"অনুপাত","body":"একই ধরনের দুটি রাশির তুলনাকে অনুপাত বলে। a:b অর্থ a/b, যেখানে b শূন্য নয়।","example":"১০:১৫ অনুপাত সরল করলে ২:৩।"},{"id":20,"grade":7,"subject":"গণিত","title":"গড়","body":"কয়েকটি সংখ্যার গড় হলো তাদের যোগফলকে সংখ্যার পরিমাণ দিয়ে ভাগ করার ফল।","example":"৫, ৭, ৯-এর গড় = ২১/৩ = ৭।"},{"id":21,"grade":7,"subject":"বিজ্ঞান","title":"পরিপাকতন্ত্র","body":"পরিপাকতন্ত্র খাদ্যকে ছোট অণুতে ভেঙে শরীরের শোষণের উপযোগী করে। মুখ, পাকস্থলী ও ক্ষুদ্রান্ত্র গুরুত্বপূর্ণ অংশ।","example":"ক্ষুদ্রান্ত্রে অধিকাংশ পুষ্টি শোষিত হয়।"},{"id":22,"grade":7,"subject":"বিজ্ঞান","title":"শব্দ","body":"শব্দ একটি যান্ত্রিক তরঙ্গ। শব্দ চলতে বায়ু, পানি বা কঠিনের মতো মাধ্যম প্রয়োজন; শূন্যস্থানে শব্দ ছড়ায় না।","example":"মহাশূন্যে শব্দ সরাসরি শোনা যায় না।"},{"id":23,"grade":8,"subject":"গণিত","title":"বীজগাণিতিক সূত্র","body":"বীজগণিতে সূত্র ব্যবহার করে গুণ ও উৎপাদক বিশ্লেষণ সহজ করা যায়। (a+b)² = a²+2ab+b²।","example":"(x+২)² = x²+৪x+৪।"},{"id":24,"grade":8,"subject":"গণিত","title":"গড় ও উপাত্ত","body":"সংখ্যাতাত্ত্বিক উপাত্তের গড় কেন্দ্রীয় প্রবণতা বোঝাতে সাহায্য করে। তবে অস্বাভাবিক বড় বা ছোট মান গড়কে প্রভাবিত করে।","example":"২, ৪, ৬-এর গড় ৪।"},{"id":25,"grade":8,"subject":"বিজ্ঞান","title":"আলোর প্রতিফলন","body":"আলো কোনো পৃষ্ঠে পড়ে ফিরে আসাকে প্রতিফলন বলে। আপতন কোণ ও প্রতিফলন কোণ অভিলম্বের সঙ্গে মাপা হয় এবং সমান।","example":"আপতন কোণ ৩৫° হলে প্রতিফলন কোণ ৩৫°।"},{"id":26,"grade":8,"subject":"বিজ্ঞান","title":"বিদ্যুৎপ্রবাহ","body":"বৈদ্যুতিক আধানের প্রবাহের হারকে তড়িৎপ্রবাহ বলে। SI একক অ্যাম্পিয়ার।","example":"২ সেকেন্ডে ৬ কুলম্ব আধান প্রবাহিত হলে গড় প্রবাহ ৩ A।"},{"id":27,"grade":9,"subject":"গণিত","title":"বর্গের বিয়োগ","body":"দুটি বর্গের বিয়োগের সূত্র a²−b²=(a−b)(a+b)। উৎপাদক বিশ্লেষণে এটি কাজে লাগে।","example":"x²−২৫=(x−৫)(x+৫)।"},{"id":28,"grade":9,"subject":"গণিত","title":"ত্রিকোণমিতিক অনুপাত","body":"সমকোণী ত্রিভুজে sin θ = বিপরীত বাহু/অতিভুজ এবং cos θ = সন্নিহিত বাহু/অতিভুজ।","example":"sin ৩০° = ১/২।"},{"id":29,"grade":9,"subject":"বিজ্ঞান","title":"পরমাণুর গঠন","body":"পরমাণুর কেন্দ্রে নিউক্লিয়াস থাকে, যেখানে প্রোটন ও সাধারণত নিউট্রন থাকে। ইলেকট্রন নিউক্লিয়াসের চারপাশের অঞ্চলে অবস্থান করে।","example":"হাইড্রোজেনের সবচেয়ে প্রচলিত আইসোটোপের নিউক্লিয়াসে একটি প্রোটন থাকে।"},{"id":30,"grade":9,"subject":"বিজ্ঞান","title":"অম্ল ও ক্ষার","body":"জলীয় দ্রবণে অম্লীয়তা ও ক্ষারীয়তা বোঝাতে pH ব্যবহার করা হয়। ২৫°C-এ pH ৭ নিরপেক্ষ, কম হলে অম্লীয়, বেশি হলে ক্ষারীয়।","example":"pH ৩ একটি অম্লীয় দ্রবণ নির্দেশ করে।"},{"id":31,"grade":10,"subject":"গণিত","title":"দ্বিঘাত সমীকরণের মূল","body":"ax²+bx+c=০ (a≠০) সমীকরণকে দ্বিঘাত বলে। উৎপাদক বিশ্লেষণ করে মূল বের করা যায়।","example":"x²−৭x+১২=০ ⇒ (x−৩)(x−৪)=০ ⇒ x=৩ বা ৪।"},{"id":32,"grade":10,"subject":"গণিত","title":"বৃত্তের পরিমাপ","body":"বৃত্তের ব্যাস ব্যাসার্ধের দ্বিগুণ। পরিধি ২πr এবং ক্ষেত্রফল πr²।","example":"r=৩ হলে ক্ষেত্রফল ৯π বর্গ একক।"},{"id":33,"grade":10,"subject":"বিজ্ঞান","title":"নিউটনের দ্বিতীয় সূত্র","body":"কোনো বস্তুর ভর ধ্রুব থাকলে লব্ধি বল F=ma; বল ত্বরণের দিকে ক্রিয়া করে।","example":"ভর ২ kg ও ত্বরণ ৩ m/s² হলে বল ৬ N।"},{"id":34,"grade":10,"subject":"বিজ্ঞান","title":"বংশগতি ও DNA","body":"জিন হলো DNA-এর নির্দিষ্ট অংশ, যা বংশগত বৈশিষ্ট্য নির্ধারণে ভূমিকা রাখে। মানুষের সাধারণ দেহকোষে ৪৬টি ক্রোমোজোম থাকে।","example":"সাধারণ দেহকোষে ক্রোমোজোম ২৩ জোড়া।"},{"id":35,"grade":11,"subject":"গণিত","title":"সীমার ধারণা","body":"কোনো চলক নির্দিষ্ট মানের কাছে গেলে ফাংশনের মান কোন সংখ্যার দিকে এগোয় তা সীমা দিয়ে প্রকাশ করা হয়।","example":"lim(x→২)(x+৫)=৭।"},{"id":36,"grade":11,"subject":"গণিত","title":"সমান্তর ধারা","body":"সমান্তর ধারায় পরপর দুটি পদের পার্থক্য সমান থাকে। n-তম পদ a+(n−1)d।","example":"৩, ৭, ১১,... ধারার পঞ্চম পদ ১৯।"},{"id":37,"grade":11,"subject":"পদার্থবিজ্ঞান","title":"কাজ ও শক্তি","body":"বল ও সরণের মধ্যে θ কোণ হলে কাজ W=Fs cosθ। কাজ ও শক্তির SI একক জুল।","example":"বল ১০ N, সরণ ২ m একই দিকে হলে কাজ ২০ J।"},{"id":38,"grade":11,"subject":"পদার্থবিজ্ঞান","title":"ভরবেগ","body":"রৈখিক ভরবেগ p=mv। বাহ্যিক লব্ধি বল শূন্য থাকলে কোনো বিচ্ছিন্ন সিস্টেমের মোট ভরবেগ সংরক্ষিত থাকে।","example":"ভর ২ kg ও বেগ ৩ m/s হলে ভরবেগ ৬ kg·m/s।"},{"id":39,"grade":12,"subject":"গণিত","title":"অন্তরক","body":"অন্তরক কোনো রাশির তাৎক্ষণিক পরিবর্তনের হার বোঝায়। d(xⁿ)/dx=nxⁿ⁻¹।","example":"d(৪x³)/dx = ১২x²।"},{"id":40,"grade":12,"subject":"গণিত","title":"অনির্দিষ্ট সমাকলন","body":"অন্তরকের বিপরীত প্রক্রিয়া হিসেবে সমাকলন ব্যবহার হয়। ∫xⁿ dx=xⁿ⁺¹/(n+1)+C, n≠−1।","example":"∫৩x² dx = x³+C।"},{"id":41,"grade":12,"subject":"পদার্থবিজ্ঞান","title":"তরঙ্গ","body":"তরঙ্গ শক্তি বহন করে। পর্যাবৃত্ত তরঙ্গের বেগ v=fλ, যেখানে f কম্পাঙ্ক ও λ তরঙ্গদৈর্ঘ্য।","example":"f=৫ Hz, λ=২ m হলে v=১০ m/s।"},{"id":42,"grade":12,"subject":"পদার্থবিজ্ঞান","title":"ধারকত্ব","body":"ধারক বৈদ্যুতিক আধান সঞ্চয় করতে পারে। ধারকত্ব C=Q/V; SI একক ফ্যারাড।","example":"Q=৬ C, V=৩ V হলে C=২ F।"}],"questions":[{"id":1,"grade":6,"subject":"গণিত","q":"৩/৫ + ১/৫ কত? ","options":["৪/১০","৪/৫","৩/১০","২/৫"],"answer":1,"why":"সমহর ভগ্নাংশে লব যোগ হয়: (৩+১)/৫ = ৪/৫।"},{"id":2,"grade":6,"subject":"গণিত","q":"ভগ্নাংশের হর কোনটি?","options":["উপরের সংখ্যা","নিচের সংখ্যা","যোগফল","গুণফল"],"answer":1,"why":"a/b ভগ্নাংশে b হলো হর।"},{"id":3,"grade":6,"subject":"বিজ্ঞান","q":"খাদ্যশৃঙ্খলে উৎপাদক সাধারণত কে?","options":["ব্যাঙ","সাপ","সবুজ উদ্ভিদ","বাঘ"],"answer":2,"why":"সবুজ উদ্ভিদ নিজেই খাদ্য তৈরি করে।"},{"id":4,"grade":6,"subject":"বিজ্ঞান","q":"উদ্ভিদ প্রধানত কোন শক্তি ব্যবহার করে খাদ্য তৈরি করে?","options":["শব্দ","সূর্যালোক","তাপমাত্রা","চুম্বক"],"answer":1,"why":"সালোকসংশ্লেষণে আলোকশক্তি ব্যবহৃত হয়।"},{"id":5,"grade":7,"subject":"গণিত","q":"২০০-এর ১৫% কত?","options":["১৫","২০","৩০","৪০"],"answer":2,"why":"২০০ × ১৫/১০০ = ৩০।"},{"id":6,"grade":7,"subject":"গণিত","q":"শতকরা অর্থ কী?","options":["প্রতি দশে","প্রতি একশতে","প্রতি হাজারে","প্রতি একে"],"answer":1,"why":"শতকরা = প্রতি ১০০-তে।"},{"id":7,"grade":7,"subject":"বিজ্ঞান","q":"সালোকসংশ্লেষণে উদ্ভিদ কোন গ্যাস গ্রহণ করে?","options":["অক্সিজেন","নাইট্রোজেন","কার্বন ডাই-অক্সাইড","হাইড্রোজেন"],"answer":2,"why":"উদ্ভিদ কার্বন ডাই-অক্সাইড ব্যবহার করে।"},{"id":8,"grade":7,"subject":"বিজ্ঞান","q":"ক্লোরোফিলের প্রধান কাজ কী?","options":["পানি শোষণ","আলো শোষণ","মাটি তৈরি","বীজ ছড়ানো"],"answer":1,"why":"ক্লোরোফিল আলোকশক্তি শোষণ করে।"},{"id":9,"grade":8,"subject":"গণিত","q":"x + ৭ = ১২ হলে x কত?","options":["৩","৪","৫ ি?","options":["৫","৬","৮","৯"],"answer":1,"why":"২ সারি × ৩ কলাম = ৬ উপাদান।"},{"id":94,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"রোধ ৫ Ω এবং প্রবাহ ২ A হলে বিভব পার্থক্য কত?","options":["২.৫ V","৭ V","১০ V","২০ V"],"answer":2,"why":"ওহমের সূত্রে V=IR=২×৫=১০ V।"},{"id":95,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"তরঙ্গের বেগের সূত্র কোনটি?","options":["v=fλ","v=f/λ","v=λ/f","v=f+λ"],"answer":0,"why":"তরঙ্গের বেগ = কম্পাঙ্ক × তরঙ্গদৈর্ঘ্য।"},{"id":96,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"ধারকের ধারকত্বের SI একক কোনটি?","options":["হেনরি","ফ্যারাড","ওহম","টেসলা"],"answer":1,"why":"ধারকত্বের SI একক ফ্যারাড।"},{"id":97,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"আলোর বেগ শূন্যস্থানে প্রায় কত?","options":["৩×১০⁶ m/s","৩×১০⁷ m/s","৩×১০⁸ m/s","৩×১০⁹ m/s"],"answer":2,"why":"শূন্যস্থানে আলোর বেগ প্রায় ৩×১০⁸ m/s।"},{"id":98,"grade":12,"subject":"পদার্থবিজ্ঞান","q":"একক সময়ে সম্পন্ন কাজকে কী বলে?","options":["বল","ক্ষমতা","ভরবেগ","ত্বরণ"],"answer":1,"why":"ক্ষমতা = কাজ / সময়।"}]};const grade=document.getElementById('grade'),subject=document.getElementById('subject'),quiz=document.getElementById('quiz'),notes=document.getElementById('notes'),next=document.getElementById('next');let list=[],position=0,score=0,answered=false;function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function showTab(which){const isQuiz=which==='quiz';document.getElementById('quizPanel').classList.toggle('hide',!isQuiz);document.getElementById('notesPanel').classList.toggle('hide',isQuiz);document.getElementById('quizTab').setAttribute('aria-selected',String(isQuiz));document.getElementById('notesTab').setAttribute('aria-selected',String(!isQuiz))}document.getElementById('quizTab').onclick=()=>showTab('quiz');document.getElementById('notesTab').onclick=()=>showTab('notes');for(let g=6;g<=12;g++)grade.add(new Option('শ্রেণি '+g,g));function fillSubjects(){const g=Number(grade.value);const subjects=[...new Set([...DB.notes,...DB.questions].filter(x=>x.grade===g).map(x=>x.subject))];subject.replaceChildren(...subjects.map(x=>new Option(x,x)));refresh()}function refresh(){list=DB.questions.filter(x=>x.grade===Number(grade.value)&&x.subject===subject.value);position=0;score=0;renderQuiz();renderNotes()}grade.onchange=fillSubjects;subject.onchange=refresh;function renderQuiz(){quiz.replaceChildren();next.hidden=true;answered=false;if(!list.length){quiz.append(el('p','এই বিষয়ে এখনো প্রশ্ন যোগ করা হয়নি।'));return}if(position>=list.length){quiz.append(el('h2','অনুশীলন শেষ!'));quiz.append(el('p','আপনার স্কোর: '+score+' / '+list.length));return}const q=list[position];quiz.append(el('p','প্রশ্ন '+(position+1)+' / '+list.length,'muted'));quiz.append(el('h2',q.q));const opts=el('div',undefined,'options');const explanation=el('div');q.options.forEach((op,i)=>{const b=el('button',(i+1)+'. '+op);b.onclick=()=>{if(answered)return;answered=true;if(i===q.answer)score++;[...opts.children].forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('correct');else if(j===i)x.classList.add('wrong')});explanation.append(el('p',(i===q.answer?'সঠিক উত্তর! ':'ভুল উত্তর। ')+q.why));next.hidden=false;next.textContent=position===list.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন'};opts.append(b)});quiz.append(opts,explanation)}next.onclick=()=>{if(!answered)return;position++;renderQuiz()};function renderNotes(){notes.replaceChildren();const rows=DB.notes.filter(x=>x.grade===Number(grade.value)&&x.subject===subject.value);if(!rows.length){notes.append(el('p','এই বিষয়ে নোট এখনো যোগ করা হয়নি।'));return}rows.forEach(x=>{const a=el('article',undefined,'note');a.append(el('h2',x.title),el('p',x.body),el('p','উদাহরণ: '+x.example,'example'));notes.append(a)})}fillSubjects();</script></body></html>
