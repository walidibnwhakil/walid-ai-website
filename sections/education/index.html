 pool(){return DB.questions.filter(x=>x.grade===Number(grade.value)&&(subject.value==='all'||x.subject===subject.value))}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startQuiz(){attempt++;responses=new Map();finished=false;const available=pool(),target=Number(grade.value)>=9?100:50;const unique=[...new Map(available.map(q=>[q.grade+'|'+q.subject+'|'+q.q.trim().toLocaleLowerCase(),q])).values()];const previous=new Set(selected.map(q=>q.grade+'|'+q.subject+'|'+q.q.trim().toLocaleLowerCase()));const fresh=shuffle(unique.filter(q=>!previous.has(q.grade+'|'+q.subject+'|'+q.q.trim().toLocaleLowerCase())));const older=shuffle(unique.filter(q=>previous.has(q.grade+'|'+q.subject+'|'+q.q.trim().toLocaleLowerCase())));setNumber=(setNumber%60)+1;const curated=[...fresh,...older].slice(0,Math.min(target,unique.length));const generated=(subject.value==='all'||subject.value==='গণিত')&&window.WalidEducationVariants?window.WalidEducationVariants.create(Number(grade.value),setNumber,target-curated.length,curated):[];selected=shuffle([...curated,...generated]);renderQuiz()}function renderQuiz(){quiz.replaceChildren();if(!selected.length){quiz.append(el('p','এই শ্রেণি বা বিষয়ে এখনো প্রশ্ন নেই।'));return}const target=Number(grade.value)>=9?100:50;quiz.append(el('h2','MCQ অনুশীলন · সেট '+setNumber));quiz.append(el('p','প্রশ্ন '+selected.length+'টি'+(selected.length<target?' — প্রশ্নব্যাংকে বর্তমানে যতগুলো প্রশ্ন আছে, ততগুলোই দেখানো হচ্ছে।':'')+'। কিছু গণিত প্রশ্ন অনুশীলনের জন্য সংখ্যাভিত্তিকভাবে তৈরি। সব প্রশ্নের উত্তর দিলে ফলাফল দেখা যাবে।','muted'));const progress=el('p','উত্তর দেওয়া হয়েছে: ০ / '+selected.length,'muted');progress.id='quizProgress';quiz.append(progress);const result=el('section',undefined,'panel');result.id='quizResult';result.hidden=true;quiz.append(result);const cards=el('div');selected.forEach((q,index)=>{const card=el('article',undefined,'panel');card.append(el('p','প্রশ্ন '+(index+1)+' · '+q.subject,'muted'),el('h2',q.q));const opts=el('div',undefined,'options'),feedback=el('div');feedback.setAttribute('aria-live','polite');q.options.forEach((option,optionIndex)=>{const button=el('button',(optionIndex+1)+'. '+option);button.onclick=()=>{if(responses.has(q.id)||finished)return;responses.set(q.id,optionIndex);const correct=optionIndex===q.answer;[...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===optionIndex)b.classList.add('wrong')});feedback.append(el('p',correct?'✓ সঠিক উত্তর!':'✗ ভুল উত্তর। সঠিক উত্তর: '+q.options[q.answer],correct?'right-text':'wrong-text'));if(!correct)feedback.append(el('p','ব্যাখ্যা: '+q.why));progress.textContent='উত্তর দেওয়া হয়েছে: '+responses.size+' / '+selected.length;if(responses.size===selected.length)finishQuiz(result)};opts.append(button)});card.append(opts,feedback);cards.append(card)});quiz.append(cards);const finish=el('button','ফলাফল দেখুন','primary');finish.onclick=()=>finishQuiz(result);finish.id='finishQuiz';const footer=el('div',undefined,'actions');footer.append(finish);quiz.append(footer)}function finishQuiz(result){if(finished)return;finished=true;const right=selected.filter(q=>responses.get(q.id)===q.answer).length,wrong=selected.filter(q=>responses.has(q.id)&&responses.get(q.id)!==q.answer).length,skipped=selected.length-responses.size,percent=Math.round(right/selected.length*100);const message=percent>=90?'তুমি অসাধারণ করেছ! এভাবেই এগিয়ে যাও।':percent>=75?'খুব ভালো করেছ! আরও একটু অনুশীলনে আরও ভালো করতে পারবে।':percent>=50?'ভালো চেষ্টা! ভুলগুলো দেখে আরেকটু অনুশীলন করো।':'আরও ভালো করতে পারবে! নোটগুলো পড়ে আবার অনুশীলন করো।';result.hidden=false;result.replaceChildren(el('h2','তোমার ফলাফল'),el('p','সঠিক: '+right+' | ভুল: '+wrong+' | উত্তর দেওয়া হয়নি: '+skipped),el('h2',percent+'%'),el('p',message));const retry=el('button','Retry — নতুন Quiz','primary');retry.onclick=()=>{startQuiz();quiz.scrollIntoView({behavior:'smooth',block
