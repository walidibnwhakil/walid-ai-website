<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports — Walid AI</title><link rel="stylesheet" href="/walid-legal.css"><style>:root{--ink:#17231d;--muted:#66736b;--line:#e4e9e5;--accent:#146c54}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:17px/1.65:"Times New Roman",serif}main{width:min(900px,100%);margin:auto;padding:24px 20px 60px}header{display:flex;justify-content:space-between;align-items:center}.logo{width:132px;height:44px;object-fit:contain}.back{padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}a{color:var(--accent)}article{margin-top:60px;padding:30px;border:1px solid var(--line);border-radius:20px;background:#ffffffdd;box-shadow:0 16px 42px #183b2512}h1{font-size:clamp(2rem,6vw,3rem);font-weight:400}.muted,.meta{color:var(--muted)}.status{padding:12px 14px;border-left:4px solid var(--accent);background:#f5faf6}.items{display:grid;gap:12px}.item{padding:16px;border:1px solid var(--line);border-radius:14px}.item h2{margin:0;font-size:1.08rem;font-weight:400}.meta{font-size:.9rem}footer{margin-top:25px;color:var(--muted)}</style></head><body><main><header><a href="/"><img class="logo" src="/walid-ai-approved-logo.png" alt="Walid AI"></a><a class="back" href="/">Main menu</a></header><article><h1>Sports</h1><p class="muted">Sports headlines refreshed automatically with honest score availability labeling.</p><div id="status" class="status" role="status">Loading updates…</div><section id="items" class="items" aria-live="polite"></section></article><footer class="legal-footer"><nav aria-label="Site information"><a href="/about-us.html">About Us</a> · <a href="/contact-us.html">Contact Us</a> · <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms-of-service.html">Terms of Service</a></nav><p>© 2026 Walid AI. All rights reserved.</p></footer></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const when=v=>v?new Date(v).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"date unavailable";
fetch("/data/sports.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{
document.querySelector("#status").textContent=true?"Scores are not available; these are verified sports headlines only. Refreshed "+when(d.updatedAt)+".":"Updated "+when(d.updatedAt)+" · Source links open original publishers.";
document.querySelector("#items").innerHTML=d.items.length?d.items.map(i=>"<article class='item'><h2><a href='"+esc(i.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(i.title)+"</a></h2><div class='meta'>"+esc(i.source)+" · "+when(i.publishedAt)+"</div></article>").join(""):"<p class='muted'>No verified updates are available right now.</p>";
}).catch(()=>document.querySelector("#status").textContent="Updates are temporarily unavailable. Please try again later.");
</script></body></html>
