:root{--green:#006a4e;--ink:#202326;--muted:#687078;--line:#e3e6e9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:16px/1.5 "Times New Roman",Times,serif}.top{min-height:76px;padding:8px clamp(16px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #eceef1}.brand{display:flex;align-items:center;gap:4px;text-decoration:none;color:inherit;white-space:nowrap}.brand img.logo{width:43px;height:43px;object-fit:contain}.brand-copy b{display:block;font-size:22px;line-height:1}.brand-copy small{position:relative;isolation:isolate;display:block;width:max-content;overflow:hidden;background:#006a4e;color:white;padding:2px 6px;font-size:11px}.brand-copy small img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;animation:wave 5s ease-in-out infinite}.nav{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,25px)}.nav a,.nav [aria-current="page"]{color:#30343a;text-decoration:none;font-size:.84rem;font-weight:700;white-space:nowrap}.nav [aria-current="page"]{color:#087653}.tool-nav [aria-current="page"]{color:#087653}.account a{color:inherit;text-decoration:none;padding:9px 15px;white-space:nowrap}.signup{background:#111;color:#fff!important;border-radius:8px}.wrap{position:relative;isolation:isolate;max-width:1120px;min-height:calc(100vh - 130px);margin:auto;padding:28px clamp(16px,4vw,40px) 54px}.wrap:before{content:"";position:absolute;z-index:-1;pointer-events:none;width:min(580px,78vw);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);background:url("/kathgolap-logo.png") center/contain no-repeat;opacity:.24;animation:flowerturn 10s ease-in-out infinite}.crumb{display:flex;align-items:center;gap:10px;margin:0 0 28px;color:#747a82;font-size:14px}.crumb a{color:#555c64;text-decoration:none}.crumb a:hover{color:#087653;text-decoration:underline}.hero{text-align:center;margin:0 auto 22px}.hero h1{font-size:clamp(34px,5vw,48px);margin:0 0 5px}.hero p{margin:0;color:#59616a}.panel{max-width:780px;margin:auto;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font:inherit;cursor:pointer}.tabs button.active{background:#202326;color:white;border-color:#202326}.drop{min-height:210px;display:grid;place-content:center;justify-items:center;gap:12px;border:0;border-radius:12px;background:transparent;text-align:center;padding:22px;transition:.15s}.drop.drag{border-color:var(--green);background:#eff8f4}.choose{border:0;border-radius:9px;padding:15px 28px;background:var(--green);color:white;font:700 20px "Times New Roman",Times,serif;cursor:pointer}.hint{color:var(--muted);margin:0}.file-list{margin:15px 0 0;padding:0;list-style:none}.file-list li{padding:8px 10px;border-bottom:1px solid #edf0f1;overflow-wrap:anywhere}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.run{border:0;border-radius:8px;background:#202326;color:#fff;padding:12px 24px;font:700 17px "Times New Roman",Times,serif;cursor:pointer}.run:disabled{opacity:.5;cursor:not-allowed}.status{text-align:center;min-height:26px;color:#566169;margin:12px 0 0}.result{display:grid;gap:8px;margin-top:14px}.result a{color:var(--green)}.footer{border-top:1px solid #eceef1;padding:14px clamp(16px,4vw,52px);font-size:14px;color:#30363b;font-weight:600}@keyframes flowerturn{0%,90%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes wave{0%,100%{clip-path:polygon(0 0,25% 4%,50% 0,75% 4%,100% 0,100% 100%,75% 96%,50% 100%,25% 96%,0 100%)}50%{clip-path:polygon(0 4%,25% 0,50% 4%,75% 0,100% 4%,100% 96%,75% 100%,50% 96%,25% 100%,0 96%)}}@media(prefers-reduced-motion:reduce){.wrap:before,.brand-copy small img{animation:none!important}}@media(max-width:700px){.top{display:grid;grid-template-columns:m </style></head><body><header class="top"><a class="brand" href="/"><img class="logo" src="/kathgolap-logo.png" alt=""><span class="brand-copy"><b>Walid AI</b><small><img src="/walid-ai-flag-wave.jfif" alt="">Bangladeshi AI</small></span></a><nav class="nav" aria-label="Main navigation"><a href="/tools/merge-pdf/">Merge PDF</a><a href="/tools/split-pdf/">Split PDF</a><a href="/tools/compress-pdf/">Compress PDF</a><a href="/tools/pdf-to-word/">Convert PDF</a><a href="/tools.html">All Tools</a></nav><div class="account"><a href="/?auth=login">Log in</a><a class="signup" href="/?auth=signup">Sign up</a></div></header><main class="wrap"><nav class="crumb" aria-label="Breadcrumb"><a href="/">Walid AI</a><span aria-hidden="true">›</span><a href="/tools.html">Tools</a><span aria-hidden="true">›</span><span id="currentTool" aria-current="page">Create ZIP</span></nav><section class="hero"><h1 id="title">Create ZIP</h1><p id="subtitle">Combine files into one ZIP archive.</p></section><section class="panel"><div class="tabs"><button id="createTab" class="active">Create ZIP</button><button id="extractTab">Extract ZIP</button></div><div class="drop" id="drop"><button class="choose" id="choose">Select files</button><p class="hint" id="hint">or drop files here</p><input id="files" type="file" multiple hidden><ul id="list" class="file-list"></ul></div><div class="actions"><button id="run" class="run" disabled>Create ZIP</button></div><p class="status" id="status" role="status"></p><div id="result" class="result"></div></section></main><footer class="footer">Walid AI - Bangladeshi AI</footer><script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js"></script><script>
const $=s=>document.querySelector(s),files=$('#files'),drop=$('#drop'),list=$('#list'),status=$('#status'),run=$('#run'),result=$('#result');let mode='create',selected=[];function setMode(next){mode=next;selected=[];files.value='';list.innerHTML='';result.innerHTML='';status.textContent='';$('#createTab').classList.toggle('active',mode==='create');$('#extractTab').classList.toggle('active',mode==='extract');$('#title').textContent=mode==='create'?'Create ZIP':'Extract ZIP';document.querySelector('#currentTool').textContent=mode==='create'?'Create ZIP':'Extract ZIP';$('#subtitle').textContent=mode==='create'?'Combine files into one ZIP archive.':'Unpack a ZIP archive and download its files.';$('#choose').textContent=mode==='create'?'Select files':'Select ZIP file';$('#hint').textContent=mode==='create'?'or drop files here':'or drop a ZIP file here';run.textContent=mode==='create'?'Create ZIP':'Extract ZIP';files.multiple=mode==='create';files.accept=mode==='extract'?'.zip,application/zip,*/*':'';run.disabled=true;location.hash='tool='+mode}function showFiles(){list.innerHTML=selected.map(f=>'<li>'+escapeHtml(f.name)+' <span style="color:#687078">('+formatSize(f.size)+')</span></li>').join('');run.disabled=!selected.length||(mode==='create'&&selected.length<1)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatSize(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}$('#createTab').onclick=()=>setMode('create');$('#extractTab').onclick=()=>setMode('extract');$('#choose').onclick=()=>files.click();files.onchange=()=>{selected=[...files.files];showFiles()};for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>{selected=[...e.dataTransfer.files];showFiles()});run.onclick=async()=>{run.disabled=true;status.textContent='Processing files…';result.innerHTML='';try{if(!window.fflate)throw Error('ZIP library could not load. Check your internet connection and try again.');if(mode==='create'){const entries={};for(const f of selected){const safe=f.name.replace(/[\\/]+/g,'_').replace(/\.\./g,'_');entries[safe]=new Uint8Array(await f.arrayBuffer())}const blob=new Blob([window.fflate.zipSync(entries,{level:6})],{type:'application/zip'});download(blob,'walid-ai-files.zip');status.textContent='Your ZIP file is ready.'}else{const archive=window.fflate.unzipSync(new Uint8Array(await selected[0].arrayBuffer()));const rows=Object.entries(archive).filter(([name])=>!name.endsWith('/'));if(!rows.length)throw Error('This ZIP archive contains no files.');status.textContent=rows.length+' file'+(rows.length===1?'':'s')+' ready to download.';for(const [name,data] of rows){const link=document.createElement('a'),blob=new Blob([data]);link.href=URL.createObjectURL(blob);link.download=name.split('/').pop()||'file';link.textContent='Download '+name;result.append(link)}}}catch(e){status.textContent=e.message||'Could not process this file.'}finally{run.disabled=!selected.length}};function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}const requested=location.hash.match(/tool=(create|extract)/);if(requested)setMode(requested[1]);</script></body></html>
